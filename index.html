<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MarketScope | Competitive Intelligence</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            max-width: 800px;
            margin: 0 auto;
            padding: 40px 20px;
        }
        h1 { color: #38bdf8; text-align: center; }
        p.subtitle { text-align: center; color: #94a3b8; margin-bottom: 40px; }
        .input-group { display: flex; gap: 10px; margin-bottom: 20px; }
        input {
            flex: 1; padding: 12px; border-radius: 6px; border: 1px solid #334155;
            background-color: #1e293b; color: white; font-size: 16px;
        }
        button {
            padding: 12px 24px; border-radius: 6px; border: none; background-color: #0ea5e9;
            color: white; font-size: 16px; font-weight: bold; cursor: pointer;
        }
        button:disabled { background-color: #475569; cursor: not-allowed; }
        #output {
            background-color: #1e293b; padding: 24px; border-radius: 8px;
            border: 1px solid #334155; white-space: pre-wrap; display: none;
            line-height: 1.6;
        }
        .loader { text-align: center; display: none; color: #38bdf8; margin-top: 20px; }
    </style>
</head>
<body>
    <h1>MarketScope</h1>
    <p class="subtitle">Multi-Agent Competitive Intelligence</p>

    <div class="input-group">
        <input type="text" id="companyInput" placeholder="Enter a company name (e.g., Tesla, Nvidia)" onkeypress="if(event.key === 'Enter') generateReport()">
        <button id="generateBtn" onclick="generateReport()">Analyze</button>
    </div>

    <div id="loader" class="loader">Running multi-agent research... (This can take 5-15s)</div>
    <div id="output"></div>

    <script>
        async function generateReport() {
            const company = document.getElementById('companyInput').value.trim();
            if (!company) return alert("Please enter a company name.");

            const btn = document.getElementById('generateBtn');
            const loader = document.getElementById('loader');
            const output = document.getElementById('output');

            // Reset UI
            btn.disabled = true;
            btn.innerText = "Analyzing...";
            loader.style.display = 'block';
            output.style.display = 'none';

            try {
                const response = await fetch('/api/v1/analyze', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ company_name: company })
                });

                if (!response.ok) throw new Error("Server error or timeout");

                const data = await response.json();
                
                // Render Markdown into HTML
                output.innerHTML = marked.parse(data.report);
                output.style.display = 'block';

            } catch (error) {
                output.innerHTML = `<p style="color: #f87171;">Error: ${error.message}</p>`;
                output.style.display = 'block';
            } finally {
                btn.disabled = false;
                btn.innerText = "Analyze";
                loader.style.display = 'none';
            }
        }
    </script>
</body>
</html>
