
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b1425">
  <title>MarketScope | Competitive Intelligence</title>

  <style>
    :root {
      font-family: Inter, "Segoe UI", system-ui, sans-serif;
      color-scheme: dark;
      --bg: #0b1426;
      --panel: #17253e;
      --border: #2a3d5d;
      --text: #e9f2ff;
      --muted: #a7bad3;
      --sky: #61cbff;
      --green: #58d5ae;
      --gold: #f2c66c;
      --red: #f08b9b;
      --violet: #b5a4ff;
      --surface: linear-gradient(145deg, #1b2b48, #15223a 77%);
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      color: var(--text);
      background: radial-gradient(ellipse 100% 370px at 88% -175px, #315787 0%, transparent 100%), var(--bg);
      font-size: 14px;
    }
    input, button { font: inherit; }
    button, summary { cursor: pointer; }
    :focus-visible { outline: 2px solid var(--sky); outline-offset: 3px; }
    .topbar { border-bottom: 1px solid #223754; background: #0f1b31b0; }
    .topbar-inner, .shell { max-width: 1390px; margin: auto; padding-inline: 24px; }
    .topbar-inner, .branding, .workflow-badges { display: flex; align-items: center; }
    .topbar-inner { justify-content: space-between; gap: 16px; min-height: 72px; }
    .branding { gap: 11px; }
    .brand-logo {
      display: grid; place-items: center; width: 38px; height: 38px; border-radius: 10px;
      background: linear-gradient(145deg, #9ce8fd, #43a6f6 60%, #2478d7);
      box-shadow: 0 3px 14px #359cff42, inset 0 1px 1px #fff9;
      color: #0e2947; font-size: 23px; font-weight: 850;
    }
    .brand-name { color: var(--sky); font-size: 21px; font-weight: 760; letter-spacing: -.03em; }
    .brand-sub { margin-top: 2px; color: var(--muted); font-size: 11px; }
    .workflow-badges { gap: 7px; }
    .workflow-badges span {
      padding: 5px 9px; border-radius: 99px; border: 1px solid #2b405f;
      background: #162641; color: #b9cce3; font-size: 11px;
    }
    .workflow-badges span:first-child::before { content: "●"; color: var(--green); margin-right: 5px; }
    .shell { padding-top: 17px; padding-bottom: 48px; }
    .search { display: flex; gap: 9px; margin: 0 0 14px; }
    .search input {
      min-width: 0; min-height: 42px; padding: 9px 13px;
      border: 1px solid #2c4264; border-radius: 9px;
      background: #15243e; color: var(--text);
    }
    .search input::placeholder, .library-controls input::placeholder { color: #a0b5d0; }
    #companyInput { flex: 1.7 1 180px; }
    #websiteInput { flex: 1 1 160px; }
    .search button {
      min-height: 42px; padding-inline: 23px; border: 1px solid #8be1ff;
      border-radius: 9px; background: linear-gradient(145deg, #80e3fc, #3ca9f1);
      box-shadow: 0 1px 14px #35abf341, inset 0 1px 1px #fff9;
      color: #081d34; font-weight: 760;
    }
    .search button:hover:not(:disabled) { background: #8addff; }
    .search button:disabled, .export-actions button:disabled { opacity: .55; cursor: default; }
    .export-actions { display: flex; flex-wrap: wrap; gap: 7px; justify-content: flex-end; margin-bottom: 10px; }
    .export-actions button {
      min-height: 33px; padding: 5px 11px; border: 1px solid #385477; border-radius: 7px;
      background: #162b46; color: #c5e8ff; font-size: 12px; font-weight: 650;
    }
    .export-actions button:hover:not(:disabled) { background: #21436a; border-color: var(--sky); }
    .build-marker { display: block; color: var(--muted); font-size: 10px; margin-top: 18px; }
    #loader, .demo-label, .error-box {
      border: 1px solid #625030; border-radius: 10px; padding: 10px 13px;
      color: #ffe2a7; background: #302b25; margin: 0 0 12px;
    }
    #loader, .demo-label { display: none; }
    .error-box { color: #ffced5; border-color: #684153; background: #302539; }
    .brief-intro { display: flex; align-items: baseline; flex-wrap: wrap; gap: 6px 12px; margin: 13px 0 9px; }
    .brief-intro h1 { font-size: clamp(23px, 3vw, 30px); margin: 0; letter-spacing: -.028em; overflow-wrap: anywhere; }
    .company-domain { color: #a7d6f9; font-size: 12px; overflow-wrap: anywhere; }
    .brief-metrics { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin-bottom: 13px; }
    .brief-metric {
      --glow: #4386cb6b;
      min-width: 0; min-height: 104px; border: 1px solid var(--border); border-radius: 12px;
      padding: 12px 14px;
      background: radial-gradient(ellipse 76px 63px at right 1px top 0, var(--glow), transparent 90%), var(--surface);
      box-shadow: 0 4px 16px #0309122b, inset 0 1px #a4caff0a;
    }
    .brief-metric:nth-child(2) { --glow: #4d77b86a; }
    .brief-metric:nth-child(3) { --glow: #37799170; }
    .brief-metric:nth-child(4) { --glow: #586dba6b; }
    .metric-label, .metric-note { display: block; color: var(--muted); }
    .metric-label { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; }
    .metric-value { display: block; margin: 4px 0; font-size: clamp(18px, 2.2vw, 27px); line-height: 1.15; overflow-wrap: anywhere; }
    .metric-value[data-tone="caution"] { color: var(--gold); }
    .metric-value[data-tone="positive"] { color: var(--green); }
    .metric-value[data-tone="negative"] { color: var(--red); }
    .metric-note { font-size: 11px; line-height: 1.4; overflow-wrap: anywhere; }
    .brief-status {
      display: flex; flex-wrap: wrap; gap: 4px 14px; margin: 0 0 13px;
      padding: 7px 11px; border: 1px solid #564b38; border-radius: 8px;
      background: #252938; color: #f4dba7; font-size: 12px; line-height: 1.45;
    }
    .brief-status p { margin: 0; }
    .dashboard { display: grid; grid-template-columns: minmax(0, 2.35fr) minmax(282px, 1fr); gap: 13px; align-items: start; }
    .main-column, .aside-column { display: grid; gap: 12px; min-width: 0; align-content: start; }
    .panel {
      min-width: 0; overflow: hidden; border: 1px solid var(--border); border-radius: 12px;
      background: var(--surface); box-shadow: 0 4px 18px #030a1628, inset 0 1px #b3ceff0a;
    }
    .panel-head {
      display: flex; justify-content: space-between; align-items: center; gap: 8px; min-height: 48px;
      padding: 10px 13px; border-bottom: 1px solid #2b3f5d; background: #36568014;
    }
    .panel-head h2 { display: flex; align-items: center; gap: 8px; margin: 0; font-size: 15px; font-weight: 750; }
    .panel-icon, .insight-icon, .competitor-avatar {
      display: inline-grid; place-items: center; flex: none; border-radius: 6px;
      background: #2a486c; color: #a0d8fa; font-weight: 750;
    }
    .panel-icon { width: 24px; height: 24px; font-size: 13px; }
    .panel-tag {
      flex: none; padding: 3px 7px; border: 1px solid #326a62; border-radius: 99px;
      background: #173f3e; color: #92ebcc; font-size: 10px;
    }
    .panel-content, .breakdown-body, .competitor-body { padding: 12px 13px; }
    .empty-state, .brief-note, .coverage {
      color: var(--muted); font-size: 12px; line-height: 1.5; overflow-wrap: anywhere;
    }
    .empty-state { margin: 0; padding: 12px 13px; }
    .panel-content > :first-child, .breakdown-body > :first-child, .competitor-body > :first-child { margin-top: 0; }
    .panel-content > :last-child, .breakdown-body > :last-child, .competitor-body > :last-child { margin-bottom: 0; }
    .insights { padding: 0 13px; }
    .insight { display: grid; grid-template-columns: 32px minmax(0, 1fr); gap: 10px; padding: 13px 0; }
    .insight + .insight, .competitor-entry + .competitor-entry, .library-source + .library-source { border-top: 1px solid #2b3f5d; }
    .insight-icon { width: 32px; height: 32px; font-size: 15px; }
    [data-category="funding"] { --accent: #83e4c5; --tint: #25504e; }
    [data-category="product"] { --accent: #a4d8ff; --tint: #24496d; }
    [data-category="partnership"] { --accent: #c5b7ff; --tint: #44366d; }
    [data-category="expansion"] { --accent: #f6d58d; --tint: #514432; }
    [data-category="talent"] { --accent: #ffaebb; --tint: #534053; }
    .insight-icon, .category-chip { color: var(--accent, #a8c7ef); background: var(--tint, #273d60); }
    .insight-heading { display: flex; flex-wrap: wrap; align-items: center; gap: 5px 9px; margin-bottom: 4px; }
    .insight-title, .competitor-name { color: var(--text); font-size: 14px; line-height: 1.35; font-weight: 750; margin: 0; overflow-wrap: anywhere; }
    .category-chip { padding: 2px 6px; border-radius: 4px; font-size: 10px; font-weight: 650; }
    .source-preview {
      display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
      margin: 0; color: #cbd9ec; line-height: 1.48; font-size: 13px; overflow-wrap: anywhere; white-space: pre-line;
    }
    .insight-content:has(.evidence-detail[open]) > .source-preview { display: none; }
    .source-row { display: flex; align-items: baseline; flex-wrap: wrap; gap: 5px; margin-top: 7px; }
    .source-label { color: var(--muted); font-size: 10px; margin-right: 2px; }
    .source-chip {
      display: inline-block; min-width: 0; max-width: min(100%, 350px); overflow: hidden;
      text-overflow: ellipsis; white-space: nowrap; color: #c6e8ff; background: #152843;
      border: 1px solid #385170; padding: 3px 7px; border-radius: 5px; font-size: 11px; text-decoration: none;
    }
    .source-chip:hover, .timeline-link:hover { text-decoration: underline; color: #e0f7ff; }
    .evidence-actions { display: flex; align-items: baseline; flex-wrap: wrap; gap: 3px 9px; margin-top: 6px; }
    .evidence-actions > .source-row { margin-top: 0; min-width: 0; }
    .evidence-detail, .interpretation, .quoted-evidence, .publication-detail { min-width: 0; margin-top: 7px; }
    .evidence-actions > .evidence-detail { margin: 0; }
    .evidence-actions > .evidence-detail[open] { flex-basis: 100%; }
    details > summary { color: #a5d9fc; font-size: 12px; line-height: 1.5; padding-block: 3px; }
    .source-fact, .quoted-evidence blockquote {
      margin: 9px 0; padding: 7px 10px; border-left: 2px solid var(--sky);
      background: #0f1f35; color: #d7e4f5; font-size: 13px; line-height: 1.57; white-space: pre-wrap;
      overflow-wrap: anywhere;
    }
    .evidence-id { color: var(--muted); font-size: 10px; overflow-wrap: anywhere; }
    .timing-note { margin: 5px 0 0; color: var(--muted); font-size: 11px; line-height: 1.45; }
    .snapshot-text { margin: 0; color: #d6e4f6; line-height: 1.55; font-size: 13px; }
    .snapshot-evidence { margin-top: 8px; }
    .source-notes { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px; }
    .source-note { min-width: 0; border: 1px solid #2b3f5d; border-radius: 8px; padding: 9px 10px; }
    .source-note h3 { margin: 0 0 5px; font-size: 13px; line-height: 1.4; overflow-wrap: anywhere; }
    .source-note .brief-note { margin: 0 0 5px; }
    .more-source-notes { margin-top: 9px; }
    @media (max-width: 600px) { .source-notes { grid-template-columns: minmax(0, 1fr); } }
    .snapshot-label { margin-bottom: 6px; color: var(--sky); font-size: 10px; text-transform: uppercase; font-weight: 700; }
    .sentiment-body { display: flex; align-items: center; gap: 12px; padding: 12px 13px; }
    .sentiment-ring {
      position: relative; flex: none; display: grid; place-items: center;
      width: 78px; height: 78px; border-radius: 50%; background: #2d4364;
    }
    .sentiment-ring::before { content: ""; position: absolute; inset: 8px; border-radius: 50%; background: #172640; }
    .ring-label { position: relative; text-align: center; }
    .ring-label strong, .ring-label small { display: block; }
    .ring-label strong { font-size: 18px; }
    .ring-label small { font-size: 10px; color: var(--muted); }
    .sentiment-legend { min-width: 0; flex: 1; }
    .sentiment-legend strong { font-size: 13px; }
    .sentiment-legend p { margin: 3px 0 0; }
    .sentiment-legend-row, .breakdown-item-head { display: flex; align-items: center; justify-content: space-between; gap: 6px; }
    .sentiment-legend-row { margin: 4px 0; color: #d5e3f5; font-size: 12px; font-variant-numeric: tabular-nums; }
    .sentiment-legend-label { display: inline-flex; align-items: center; gap: 5px; }
    .sentiment-swatch { width: 7px; height: 7px; border-radius: 2px; }
    .sentiment-coverage { margin: 0; padding: 0 13px 11px; font-size: 11px; color: var(--muted); line-height: 1.5; }
    .breakdown-note { color: var(--muted); margin: 0 0 8px; font-size: 11px; line-height: 1.45; }
    .breakdown-item + .breakdown-item { margin-top: 8px; }
    .breakdown-item-head { margin-bottom: 4px; color: #d5e3f5; font-size: 11px; }
    .breakdown-track { height: 5px; min-width: 0; overflow: hidden; border-radius: 99px; background: #0e1c31; }
    .breakdown-fill { height: 100%; border-radius: 99px; background: linear-gradient(90deg, #3fb3e7, var(--accent, #87cfff)); }
    .competitor-entry { display: grid; grid-template-columns: 24px minmax(0, 1fr); gap: 8px; padding: 8px 0; }
    .competitor-entry:first-child { padding-top: 0; }
    .competitor-entry:last-child { padding-bottom: 0; }
    .competitor-avatar { width: 24px; height: 24px; font-size: 10px; }
    .competitor-content { min-width: 0; display: flex; align-items: baseline; flex-wrap: wrap; justify-content: space-between; gap: 3px 9px; }
    .competitor-content > .evidence-detail { margin: 0; }
    .competitor-content > .evidence-detail[open] { flex-basis: 100%; }
    .competitor-entry:nth-child(3n+2) .competitor-avatar { background: #453b6b; color: #c9b8ff; }
    .competitor-entry:nth-child(3n) .competitor-avatar { background: #21504d; color: #97e8d1; }
    .timeline-empty, .publication-detail { padding: 0 13px; }
    .timeline-empty { margin: 11px 0 0; color: var(--muted); line-height: 1.5; font-size: 12px; }
    .timeline-empty strong { color: var(--text); display: block; margin-bottom: 3px; }
    .publication-detail { margin: 7px 0 11px; }
    .timeline { list-style: none; margin: 7px 0 0; padding: 0; }
    .timeline li { position: relative; margin-left: 4px; padding: 0 0 9px 10px; border-left: 1px solid #416688; }
    .timeline li::before { content: ""; position: absolute; background: var(--sky); width: 7px; height: 7px; border-radius: 50%; left: -4px; top: 4px; }
    .timeline-date { color: #d5edff; font-size: 11px; }
    .timeline-link { display: block; color: #aedaff; font-size: 11px; line-height: 1.38; overflow-wrap: anywhere; text-decoration: none; }
    .context-observation { padding: 8px 0; }
    .context-observation + .context-observation { border-top: 1px solid #2b3f5d; }
    .context-observation .brief-note { margin: 3px 0; }
    .diagnostics { padding: 0 12px 10px; }
    .diagnostics > summary { padding-block: 9px 4px; }
    .research-detail-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px; margin: 8px 0 0; }
    .research-detail-grid h3 { margin: 4px 0; font-size: 12px; }
    .research-detail-grid ul { padding-left: 16px; }
    .library-controls { padding: 10px 13px 0; }
    .library-controls input { width: 100%; min-height: 37px; padding: 6px 8px; border: 1px solid #344d70; border-radius: 7px; background: #101d32; color: var(--text); }
    .library-count { font-size: 11px; color: var(--muted); }
    .library-source { padding: 9px 13px; }
    .library-source .coverage { margin: 5px 0; }
    .library-source pre { white-space: pre-wrap; overflow-wrap: anywhere; font: inherit; font-size: 12px; }

    @media (max-width: 880px) {
      .dashboard { grid-template-columns: minmax(0, 1fr); }
      .aside-column { grid-template-columns: repeat(2, minmax(0, 1fr)); align-items: start; }
    }
    @media (max-width: 640px) {
      .topbar-inner, .shell { padding-inline: 13px; }
      .topbar-inner { min-height: 59px; }
      .shell { padding-top: 11px; }
      .workflow-badges { display: none; }
      .brief-metrics { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
      .brief-metric { min-height: 94px; padding: 9px 10px; }
      .metric-label { font-size: 10px; }
      .aside-column, .research-detail-grid { grid-template-columns: minmax(0, 1fr); }
      .search { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px; }
      #companyInput { grid-column: 1 / -1; }
      .search button { padding-inline: 12px; }
      .export-actions { justify-content: flex-start; }
      .panel-head { padding-inline: 10px; }
      .source-chip, details > summary { min-height: 24px; }
    }
  </style>
</head>

<body>

  <header class="topbar">
    <div class="topbar-inner">
      <div class="branding">
        <div class="brand-logo" aria-hidden="true">↗</div>
        <div>
          <div class="brand-name">MarketScope</div>
          <div class="brand-sub">Company intelligence, with the evidence in view</div>
        </div>
      </div>

      <div class="workflow-badges" aria-label="MarketScope workflow">
        <span>Evidence-linked</span>
        <span>Research</span>
        <span>Analysis</span>
        <span>Report</span>
      </div>
    </div>
  </header>

  <div class="shell">

    <form id="searchForm" class="search">
      <input
        id="companyInput"
        type="text"
        placeholder="Company name (e.g. Linear)"
        aria-label="Company name"
        maxlength="50"
        autocomplete="off"
        required
      >

      <input
        id="websiteInput"
        type="text"
        placeholder="Official website (optional)"
        aria-label="Official company website (optional)"
        autocomplete="off"
      >

      <button type="submit" id="analyzeBtn">
        Analyze
      </button>
    </form>

    <div class="export-actions">
      <button
        type="button"
        id="downloadReportButton"
        disabled
      >
        Download source brief
      </button>
      <button type="button" id="downloadEvidenceButton" disabled>
        Download evidence JSON
      </button>
    </div>

    <div id="demoLabel" class="demo-label">
      Preview mode — fictional ExampleCo sample data.
      No Tavily or GPT-4o request was made.
    </div>

    <div id="loader" role="status" aria-live="polite">
      Researching and analyzing company evidence…
    </div>

    <main id="output" aria-live="polite"></main>
    <footer class="build-marker">Dashboard build: source-brief-2026-11-19</footer>

  </div>

  <script>
    // ============================================
    // DOM references
    // ============================================

    const form = document.getElementById("searchForm");
    const input = document.getElementById("companyInput");
    const websiteInput = document.getElementById("websiteInput");
    const button = document.getElementById("analyzeBtn");
    const loader = document.getElementById("loader");
    const output = document.getElementById("output");
    const demoLabel = document.getElementById("demoLabel");

    const downloadReportButton =
      document.getElementById("downloadReportButton");
    const downloadEvidenceButton = document.getElementById("downloadEvidenceButton");

    const CATEGORIES = [
      "Product & Innovation",
      "Funding & Investment",
      "M&A / Partnerships",
      "Market Expansion",
      "Hiring & Talent",
      "Other"
    ];

    // Keep only the current completed analysis.
    let latestReportData = null;
    let latestReportIsDemo = false;


    // ============================================
    // Safe DOM utilities
    // ============================================

    function el(tag, cls = "", text) {
      const node = document.createElement(tag);

      if (cls) {
        node.className = cls;
      }

      if (text !== undefined) {
        node.textContent = String(text);
      }

      return node;
    }

    function add(parent, tag, cls = "", text) {
      const node = el(tag, cls, text);
      parent.appendChild(node);
      return node;
    }

    function safeUrl(value) {
      try {
        const parsed = new URL(value);

        return ["http:", "https:"].includes(parsed.protocol) && !parsed.username && !parsed.password
          ? parsed.href
          : null;
      } catch {
        return null;
      }
    }

    function safeLink(source, text, cls = "source-chip") {
      const href = safeUrl(source?.url);

      if (!href) {
        return null;
      }

      const link = el(
        "a",
        cls,
        text || source?.title || new URL(href).hostname
      );

      link.href = href;
      link.target = "_blank";
      link.rel = "noopener noreferrer";
      link.title = source?.title || href;

      return link;
    }

    function appendSourceLinks(parent, sources, onValidSource) {
      let count = 0;

      for (const source of Array.isArray(sources) ? sources : []) {
        const link = safeLink(source);

        if (!link) {
          continue;
        }

        if (count === 0) {
          add(parent, "span", "source-label", "Evidence");
        }

        parent.appendChild(link);

        if (onValidSource) {
          onValidSource(source);
        }

        count += 1;
      }

      return count;
    }

    function dateInfo(value) {
      if (!value) {
        return null;
      }

      const date = new Date(value);

      if (Number.isNaN(date.getTime())) {
        return null;
      }

      return {
        date,
        label: new Intl.DateTimeFormat("en-GB", {
          day: "numeric",
          month: "short",
          year: "numeric",
          timeZone: "UTC"
        }).format(date)
      };
    }

    function panel(title, symbol, extra = "") {
      const section = el("section", "panel");
      const head = add(section, "div", "panel-head");
      const heading = add(head, "h2");

      add(heading, "span", "panel-icon", symbol);

      heading.appendChild(
        document.createTextNode(title)
      );

      if (extra) {
        add(head, "span", "panel-tag", extra);
      }

      return section;
    }


    // ============================================
    // Dashboard rendering
    // ============================================

    function analysisNotices(data) {
      const warnings = Array.isArray(data.analysis_warnings)
        ? data.analysis_warnings.filter(warning => typeof warning === "string" && warning.trim()) : [];
      if (data.analysis_status === "insufficient_evidence") {
        if (Array.isArray(data.context_items) && data.context_items.length) return ["No primary developments were established. Historical/background context is shown separately.", ...warnings];
        return ["Insufficient evidence for a company overview.", ...warnings];
      }
      return warnings;
    }

    function researchCoverage(data) {
      const sources = Array.isArray(data.sources) ? data.sources : null;
      const accepted = data.source_stats?.accepted ?? sources?.length;
      const attempts = data.research_attempts;
      const evidence = data.research_coverage;
      const backgroundOnly = evidence?.status === "background_only";
      const limited = backgroundOnly || ["empty", "uncertain"].includes(evidence?.status) || accepted === 0 || accepted === 1;
      const counts = [
        Number.isInteger(attempts)
          ? `${attempts} ${attempts === 1 ? "attempt" : "attempts"}`
          : "Research attempts unavailable",
        Number.isInteger(accepted)
          ? `${accepted} accepted company ${accepted === 1 ? "source" : "sources"}`
          : "Accepted company source count unavailable"
      ].join(" · ");
      const withoutDate = sources?.filter(source => !dateInfo(source?.published_at)).length;
      let dateNote = "";
      if (withoutDate) {
        dateNote = sources.length === 1
          ? "Publication date unavailable for the company source."
          : `Publication dates unavailable for ${withoutDate} of ${sources.length} company sources.`;
      }

      return {
        limited,
        title: backgroundOnly ? "Background information report" : limited ? "Limited research coverage" : "Research Coverage",
        counts,
        dateNote,
        evidenceNote: evidence
          ? `${evidence.development_sources} sources with potential developments · ${evidence.background_sources} background sources · ${evidence.uncertain_sources} uncertain`
          : "",
        caution: Array.isArray(evidence?.limitations) && evidence.limitations.length
          ? evidence.limitations.join(" ")
          : limited ? "Important developments may be missing from this report." : "",
        warnings: Array.isArray(data.research_warnings) ? data.research_warnings : []
      };
    }

    function summaryForDisplay(data) {
      const brief = buildCompanyBrief(data);
      if (brief.cards.length) {
        const sources = new Map();
        for (const card of brief.cards) for (const source of card.sources) sources.set(source.url, source);
        return {text: brief.cards.map(card => card.text).join("\n\n"),
          sources: [...sources.values()], fromFindings: true, fromQuotes: true};
      }
      if (data.analysis_format === "evidence_ids_v2") return null;
      if (typeof data.executive_summary?.text === "string" && data.executive_summary.text.trim()) {
        return data.executive_summary;
      }
      const findings = (Array.isArray(data.insight_items) ? data.insight_items : []).filter(item =>
        typeof item?.text === "string" && item.text.trim() &&
        Array.isArray(item.sources) && item.sources.some(source => safeUrl(source?.url))
      );
      if (!findings.length) return null;
      const sources = new Map();
      for (const finding of findings) {
        for (const source of finding.sources) {
          if (safeUrl(source?.url)) sources.set(source.url, source);
        }
      }
      return {text: findings.map(item => item.text).join(" "), sources: [...sources.values()], fromFindings: true};
    }

    function sourceKind(url, officialDomain) {
      if (!officialDomain) return "Source type unknown";
      try {
        const domain = new URL(`https://${officialDomain}`).hostname.toLowerCase().replace(/^www\./, "");
        const host = new URL(url).hostname.toLowerCase().replace(/^www\./, "");
        return host === domain || host.endsWith(`.${domain}`) ? "Company source" : "External source";
      } catch { return "Source type unknown"; }
    }

    function checkedCompanyQuotes(record, data) {
      const sources = Array.isArray(data.sources) ? data.sources : [];
      const normalize = value => value.replace(/\s+/g, " ").trim();
      const isWord = value => value && /[\p{L}\p{N}_]/u.test(value);
      const quotes = [];
      for (const evidence of Array.isArray(record?.evidence) ? record.evidence : []) {
        if (typeof evidence?.source_id !== "string" || !/^S[1-9]\d{0,14}$/.test(evidence.source_id)) return [];
        const source = sources[Number(evidence.source_id.slice(1)) - 1];
        if (!source || typeof source.content !== "string" || typeof evidence.quote !== "string" ||
            !evidence.quote.trim() || !safeUrl(source.url) || safeUrl(source.url) !== safeUrl(evidence.url)) return [];
        if (data.analysis_format === "evidence_ids_v2") {
          const id = typeof evidence.evidence_id === "string"
            ? evidence.evidence_id.match(/^([SC][1-9]\d*)-[0-9a-f]{16}-(\d+)-(\d+)$/) : null;
          if (!id || id[1] !== evidence.source_id) return [];
          const start = Number(id[2]), end = Number(id[3]), body = Array.from(source.content);
          if (!Number.isSafeInteger(start) || !Number.isSafeInteger(end) || start < 0 || end <= start ||
              end > body.length || body.slice(start, end).join("") !== evidence.quote) return [];
        }
        const content = normalize(source.content), quote = normalize(evidence.quote);
        let found = false;
        for (let start = content.indexOf(quote); start !== -1; start = content.indexOf(quote, start + 1)) {
          if (!isWord(content[start - 1]) && !isWord(content[start + quote.length])) { found = true; break; }
        }
        if (!found) return [];
        if (!quotes.some(q => q.url === source.url && normalize(q.quote) === quote)) {
          quotes.push({quote: evidence.quote, title: source.title, url: source.url, source_id: evidence.source_id,
            ...(evidence.evidence_id ? {evidence_id: evidence.evidence_id} : {})});
        }
      }
      return quotes;
    }

    function buildCompanyBrief(data) {
      const findings = companyObservations(data);
      const records = new Map();
      for (const source of Array.isArray(data.sources) ? data.sources : []) {
        if (safeUrl(source?.url)) records.set(source.url, source);
      }
      const cards = findings.map(record => {
        const evidence = checkedCompanyQuotes(record, data);
        if (!evidence.length) return null;
        return {title: evidence[0].title || "Selected source observation", text: evidence.map(e => e.quote).join("\n\n"),
          interpretation: record.text || "", category: record.category, evidence,
          sources: [...new Map(evidence.map(e => [e.url, {title: e.title, url: e.url}])).values()]};
      }).filter(Boolean);
      const selectedUrls = new Set(cards.flatMap(card => card.sources.map(s => s.url)));
      const contextCards = (Array.isArray(data.context_items) ? data.context_items : []).map(record => {
        const evidence = checkedCompanyQuotes(record, data);
        if (!evidence.length) return null;
        return {title: evidence[0].title || "Background source", text: evidence.map(e => e.quote).join("\n\n"),
          interpretation: record.text || "", evidence,
          sources: [...new Map(evidence.map(e => [e.url, {title: e.title, url: e.url}])).values()],
          label: record.temporal_status === "historical" ? "Historical context" : "Timing uncertain — background context",
          note: typeof record.temporal_note === "string" ? record.temporal_note : "Kept separately from selected developments."};
      }).filter(Boolean);
      const contextUrls = new Set(contextCards.flatMap(card => card.sources.map(s => s.url)));
      const library = [...records.values()].map(source => ({...source, used: selectedUrls.has(source.url),
        usedAsContext: contextUrls.has(source.url),
        kind: sourceKind(source.url, data.official_domain)}));
      const additionalSources = library.filter(source => !source.used && !source.usedAsContext);
      const gaps = [];
      if (!cards.length) gaps.push("No source-bound company excerpts are available for the selected findings. Treat generated notes as unverified.");
      const selected = library.filter(source => source.used);
      if (selected.length && selected.every(source => source.kind === "Company source")) {
        gaps.push("Selected observations rely entirely on company-published material. Independent corroboration is not established.");
      }
      if (!data.official_domain) gaps.push("An official website was not recorded. Company and external source types cannot be distinguished reliably.");
      if (additionalSources.length) gaps.push(`${additionalSources.length} retrieved sources were not used in these observations. Other useful developments may be present in the source library.`);
      const unknownDates = selected.filter(source => !dateInfo(source.published_at)).length;
      if (unknownDates) gaps.push(`Publication dates are unavailable for ${unknownDates} selected sources. Recency and event dates need checking.`);
      gaps.push("This is a bounded web research brief, not a complete record of company activity or independently verified performance.");
      const questionMap = {
        "Product & Innovation": "Which users can access the announced capability, and does it change their workflow, pricing or integrations?",
        "Funding & Investment": "Is this primary capital or shareholder liquidity, and who received the proceeds?",
        "M&A / Partnerships": "Is the deal announced or completed, and what scope and commercial terms are actually disclosed?",
        "Market Expansion": "Is the expansion operational, and is there evidence of customers or revenue in the new market?",
        "Hiring & Talent": "When does the leadership or hiring change take effect, and what responsibilities are confirmed?",
        "Other": "What is confirmed by the source, and which consequences still need evidence?"
      };
      const categories = [...new Set(findings.map(item => CATEGORIES.includes(item.category) ? item.category : "Other"))];
      return {cards, contextCards, library, additionalSources, gaps, sourceCount: library.length, selectedSourceCount: selectedUrls.size,
        questions: categories.map(category => questionMap[category])};
    }

    function renderSourceLibrary(parent, brief) {
      const library = panel("Source library", "▥", "All retained company sources");
      const controls = add(library, "div", "library-controls");
      add(controls, "p", "brief-note", "Company and external labels describe the website, not editorial independence or factual verification.");
      const query = add(controls, "input");
      query.type = "search";
      query.placeholder = "Filter sources by title, website or excerpt";
      query.setAttribute("aria-label", "Filter company sources");
      const count = add(controls, "p", "library-count");
      const list = add(library, "div");
      const update = () => {
        list.replaceChildren();
        const term = String(query.value || "").toLowerCase().trim();
        const sources = brief.library.filter(source => `${source.title} ${source.url} ${source.content || ""}`.toLowerCase().includes(term));
        count.textContent = `${sources.length} of ${brief.sourceCount} retained sources · excerpts may be incomplete`;
        for (const source of sources) {
          const row = add(list, "article", "library-source");
          const link = safeLink(source);
          if (link) row.appendChild(link);
          add(row, "p", "coverage", `${source.kind} · ${source.used ? "Used in selected observations" : source.usedAsContext ? "Used in historical/background context" : "Additional source — not selected"}`);
          add(row, "p", "coverage", `Published: ${dateInfo(source.published_at)?.label || "Date unavailable"} · Publication date is not necessarily the event date`);
          if (typeof source.content === "string" && source.content.trim()) {
            const details = add(row, "details");
            add(details, "summary", "brief-note", "Read retrieved excerpt");
            add(details, "pre", "", source.content);
          }
        }
        if (!sources.length) add(list, "p", "empty-state", "No sources match this filter.");
      };
      query.addEventListener("input", update);
      update();
      parent.appendChild(library);
    }

    function findingPresentation(record, data) {
      const quotes = checkedCompanyQuotes(record, data);
      if (data.analysis_format === "evidence_ids_v2") return {quotes,
        text: quotes.length ? quotes.map(q => q.quote).join("\n\n") : "This observation was withheld because its selected body passages could not be checked.",
        title: "Selected company source passage", label: quotes.length ? "Exact selected source text" : "Selected evidence unavailable",
        sources: quotes.length ? [...new Map(quotes.map(q => [q.url, {title: q.title, url: q.url}])).values()] : []};
      return {quotes, text: quotes.length ? quotes.map(q => q.quote).join("\n\n") : record.text || "",
        title: quotes.length ? quotes[0].title || "Source observation" : record.event || "Generated finding",
        label: quotes.length ? "Source excerpt" : "Quote support unavailable — generated note",
        sources: quotes.length ? [...new Map(quotes.map(q => [q.url, {title: q.title, url: q.url}])).values()] : record.sources};
    }

    function companyObservations(data) {
      const records = [], byExcerpt = new Map();
      const normalize = text => text.replace(/\s+/g, " ").trim();
      for (const item of Array.isArray(data.insight_items) ? data.insight_items : []) {
        const quotes = checkedCompanyQuotes(item, data);
        const key = [...new Set(quotes.map(q => normalize(q.quote)))].sort().join("\u0000");
        const previous = quotes.length ? byExcerpt.get(key) : null;
        if (previous) {
          for (const quote of quotes) if (!previous.evidence.some(q => q.url === quote.url && normalize(q.quote) === normalize(quote.quote))) previous.evidence.push(quote);
          if (!previous.interpretations.includes(item.text)) previous.interpretations.push(item.text);
          previous.text = previous.interpretations.filter(Boolean).join("\n\n");
          continue;
        }
        const record = {...item, evidence: quotes.length ? quotes : item.evidence,
          interpretations: [item.text]};
        records.push(record);
        if (quotes.length) byExcerpt.set(key, record);
      }
      return records;
    }

    function competitorQuotes(record, data = null) {
      const sources = Array.isArray(record.sources) ? record.sources : [];
      return (Array.isArray(record.evidence) ? record.evidence : []).filter(q =>
        typeof q?.quote === "string" && q.quote.trim() && safeUrl(q.url) &&
        sources.some(s => safeUrl(s?.url) === safeUrl(q.url)) &&
        (data?.analysis_format !== "evidence_ids_v2" ||
          (typeof q.source_id === "string" && /^C[1-9]\d*$/.test(q.source_id) &&
           typeof q.evidence_id === "string" && q.evidence_id.startsWith(q.source_id + "-") &&
           /^C[1-9]\d*-[0-9a-f]{16}-\d+-\d+$/.test(q.evidence_id)))
      );
    }

    function appendInterpretation(parent, text) {
      const details = add(parent, "details", "interpretation");
      add(details, "summary", "", "AI interpretation — review against the excerpts");
      add(details, "p", "", text);
      add(details, "p", "brief-note", "Generated wording may add details the selected excerpts do not establish. It is not independently verified.");
    }

    function researchAttemptText(attempt) {
      const lanes = {first: "Initial search", business: "Broader news search", official: "Official announcements"};
      const outcomes = {ok: "completed", failed: "failed", invalid_response: "unreadable response"};
      return `${lanes[attempt.lane] || "Company search"} — ${outcomes[attempt.status] || "unknown outcome"}; ` +
        `${attempt.new_sources ?? "Unknown"} new company sources`;
    }

    const categoryStyles = {
      "Product & Innovation": ["product", "✦"],
      "Funding & Investment": ["funding", "↗"],
      "M&A / Partnerships": ["partnership", "⇄"],
      "Market Expansion": ["expansion", "◎"],
      "Hiring & Talent": ["talent", "+"],
      "Other": ["other", "·"]
    };

    function sentimentSourceKey(value) {
      const safe = safeUrl(value);
      if (!safe) return null;
      const url = new URL(safe);
      for (const key of [...url.searchParams.keys()]) {
        if (/^(utm_|gclid$|fbclid$)/i.test(key)) url.searchParams.delete(key);
      }
      url.searchParams.sort();
      return url.host.replace(/^www\./i, "") + url.pathname.replace(/\/+$/, "") + url.search;
    }

    function sourceSentiment(data) {
      const sources = Array.isArray(data.sources) ? data.sources : [];
      const keys = sources.map(source => sentimentSourceKey(source?.url));
      const parents = keys.map((_, index) => index);
      const firstByUrl = new Map();
      const firstByBody = new Map();
      const groupFor = index => {
        while (parents[index] !== index) index = parents[index];
        return index;
      };
      function groupDuplicate(index, value, seen) {
        if (!value) return;
        if (seen.has(value)) parents[groupFor(index)] = groupFor(seen.get(value));
        else seen.set(value, index);
      }
      keys.forEach((key, index) => {
        if (!key) return;
        const content = sources[index]?.content;
        const body = typeof content === "string" ? content.trim().replace(/\s+/g, " ") : "";
        groupDuplicate(index, key, firstByUrl);
        groupDuplicate(index, body, firstByBody);
      });
      const total = new Set(keys.flatMap((key, index) => key ? [groupFor(index)] : [])).size;
      const labels = new Map();
      const counts = {positive: 0, neutral: 0, negative: 0};
      for (const assessment of Array.isArray(data.source_sentiments) ? data.source_sentiments : []) {
        const id = /^S([1-9]\d*)$/.exec(assessment?.source_id || "");
        const index = id ? Number(id[1]) - 1 : -1;
        const label = typeof assessment?.label === "string" ? assessment.label.trim().toLowerCase() : "";
        if (!keys[index] || keys[index] !== sentimentSourceKey(assessment.url) || !Object.hasOwn(counts, label)) continue;
        const group = groupFor(index);
        if (!labels.has(group)) labels.set(group, label);
        else if (labels.get(group) !== label) labels.set(group, null);
      }
      for (const label of labels.values()) if (label) counts[label] += 1;
      const assessed = Object.values(counts).reduce((sum, count) => sum + count, 0);
      const max = Math.max(...Object.values(counts));
      const leaders = Object.keys(counts).filter(key => counts[key] === max);
      return {counts, assessed, total, ready: assessed >= 3, dominant: leaders.length === 1 ? leaders[0] : null};
    }

    function comparisonEntries(data) {
      const records = Array.isArray(data.competitors) ? data.competitors : [];
      return records.filter(record => record && typeof record === "object").map(record => {
        const quotes = competitorQuotes(record, data);
        const name = typeof record.name === "string" ? record.name.trim().replace(/\s+/g, " ") : "";
        const escapedName = name.replace(/[.*+?^$(){}|[\]\\]/g, "\\$&");
        const matcher = name ? new RegExp("(^|[^\\p{L}\\p{N}])" + escapedName + "(?=$|[^\\p{L}\\p{N}])", "iu") : null;
        const named = matcher && quotes.some(item => matcher.test(item.quote.replace(/\s+/g, " ")));
        return {name: named ? name : null, quotes};
      }).filter(entry => entry.quotes.length);
    }

    function titleCase(value) {
      return value[0].toUpperCase() + value.slice(1);
    }

    function renderKpis(parent, data, observations, background, coverage, sentiment, comparisons) {
      const distinctComparisons = new Set(comparisons.flatMap(item => item.name ? [item.name.toLowerCase()] : [])).size;
      const accepted = data.source_stats?.accepted ?? (Array.isArray(data.sources) ? data.sources.length : null);
      const coverageLabel = data.research_coverage?.status === "background_only" ? "Background" :
        coverage.limited ? "Limited" : data.research_coverage?.status === "mixed" ? "Mixed" :
          Number.isInteger(accepted) ? "Available" : "Unavailable";
      const metrics = [
        ["Key Developments", observations.length || "—", observations.length ? "Selected observations · timing unverified" : background.length ? "Background evidence only" : "None established", ""],
        ["Research Coverage", coverageLabel, coverage.counts.split(" · ")[1] || "", coverage.limited ? "caution" : ""],
        ["Source Sentiment", sentiment.ready ? (sentiment.dominant ? titleCase(sentiment.dominant) : "Mixed") : "Insufficient",
          sentiment.total ? sentiment.assessed + " of " + sentiment.total + " sources assessed" : "No usable assessments", sentiment.ready ? sentiment.dominant : ""],
        ["Competitors Identified", distinctComparisons || "—", distinctComparisons ?
          (distinctComparisons === 1 ? "1 name in selected comparison evidence" : "Names in selected comparison evidence") :
          comparisons.length ? "Comparison sources available" : "None established", ""]
      ];
      const grid = add(parent, "div", "brief-metrics");
      for (const [label, value, note, tone] of metrics) {
        const card = add(grid, "article", "brief-metric");
        add(card, "span", "metric-label", label);
        const metric = add(card, "strong", "metric-value", value);
        if (tone) metric.setAttribute("data-tone", tone);
        add(card, "span", "metric-note", note);
      }
    }

    function renderSentiment(parent, sentiment) {
      const section = panel("Sentiment", "◉");
      const body = add(section, "div", "sentiment-body");
      const ring = add(body, "div", "sentiment-ring");
      ring.setAttribute("aria-hidden", "true");
      const ringLabel = add(ring, "span", "ring-label");
      const legend = add(body, "div", "sentiment-legend");
      const {assessed, total, counts, dominant, ready} = sentiment;
      if (ready) {
        const positiveEnd = 100 * counts.positive / assessed;
        const neutralEnd = positiveEnd + 100 * counts.neutral / assessed;
        ring.style.background = "conic-gradient(var(--green) 0% " + positiveEnd + "%, var(--gold) " +
          positiveEnd + "% " + neutralEnd + "%, var(--red) " + neutralEnd + "% 100%)";
        add(ringLabel, "strong", "", dominant ? Math.round(100 * counts[dominant] / assessed) + "%" : String(assessed));
        add(ringLabel, "small", "", dominant ? titleCase(dominant) : "assessed");
        for (const [label, color] of [["positive", "green"], ["neutral", "gold"], ["negative", "red"]]) {
          const row = add(legend, "div", "sentiment-legend-row");
          const name = add(row, "span", "sentiment-legend-label");
          add(name, "i", "sentiment-swatch").style.background = "var(--" + color + ")";
          add(name, "span", "", titleCase(label));
          add(row, "span", "", counts[label] + " · " + Math.round(100 * counts[label] / assessed) + "%");
        }
        add(section, "p", "sentiment-coverage", assessed + " of " + total + " sources assessed. Shows source portrayal.");
      } else {
        add(ringLabel, "strong", "", "—");
        add(legend, "strong", "", "Insufficient data");
        add(legend, "p", "brief-note", assessed ? assessed + " of " + total + " sources assessed. At least 3 distinct sources needed." :
          "At least 3 distinct, assessed sources are needed.");
      }
      parent.appendChild(section);
    }

    function addPassages(parent, quotes, label = "Full evidence", sources = []) {
      const details = add(parent, "details", "evidence-detail");
      add(details, "summary", "", label);
      if (sources.length) appendSourceLinks(add(details, "div", "source-row"), sources);
      for (const evidence of quotes) {
        add(details, "blockquote", "source-fact", evidence.quote);
        if (evidence.evidence_id) add(details, "code", "evidence-id", evidence.evidence_id);
      }
      return details;
    }

    function renderObservation(parent, item, data, isContext = false) {
      const category = CATEGORIES.includes(item.category) ? item.category : null;
      const [style, icon] = categoryStyles[category] || ["other", "▤"];
      const appearance = findingPresentation(item, data);
      const card = add(parent, "article", isContext ? "insight context-observation" : "insight");
      card.setAttribute("data-category", style);
      const symbol = add(card, "div", "insight-icon", icon);
      symbol.setAttribute("aria-hidden", "true");
      const content = add(card, "div", "insight-content");
      const heading = add(content, "div", "insight-heading");
      add(heading, "h3", "insight-title", category || (isContext ? "Background source" : "Company observation"));
      if (isContext) add(heading, "span", "category-chip", item.temporal_status === "historical" ? "Historical context" : "Background");
      else add(heading, "span", "category-chip", "Timing uncertain");
      if (appearance.quotes.length) {
        add(content, "p", "source-preview", isContext ? appearance.quotes.map(item => item.quote).join("\n") : appearance.quotes[0].quote);
        const meta = add(content, "div", "evidence-actions");
        appendSourceLinks(add(meta, "div", "source-row"), appearance.sources);
        const details = addPassages(meta, appearance.quotes);
        if (item.temporal_note) add(details, "p", "timing-note", item.temporal_note);
      } else {
        add(content, "p", "brief-note", "Selected passage unavailable.");
        if (data.analysis_format !== "evidence_ids_v2" && appearance.text) {
          appendSourceLinks(add(content, "div", "source-row"), appearance.sources);
          appendInterpretation(content, appearance.text);
        }
      }
    }

    function sourceNoteText(source) {
      if (typeof source.content !== "string") return "";
      const lines = source.content.split(/\r?\n|\[\.\.\.\]/).map(line => line.trim()).filter(Boolean);
      const excerpt = lines.find(line => line.length >= 80 && !/^[#|]/.test(line)) || lines[0] || "";
      return excerpt.length > 350 ? excerpt.slice(0, 350).replace(/\s+\S*$/, "").trimEnd() + "…" : excerpt;
    }

    const featuredSourceLimit = 6;

    function renderSourceNotes(parent, sources) {
      if (!sources.length) return;
      const section = panel("Source notes", "▥", sources.length + (sources.length === 1 ? " source" : " sources"));
      const body = add(section, "div", "panel-content");
      add(body, "p", "brief-note", "Excerpts from retrieved pages. Use the links for context.");
      function rows(container, items) {
        const grid = add(container, "div", "source-notes");
        for (const source of items) {
          const card = add(grid, "article", "source-note");
          const title = add(card, "h3");
          const link = safeLink(source, source.title || "Read source", "timeline-link");
          if (link) title.appendChild(link);
          const published = dateInfo(source.published_at);
          add(card, "p", "brief-note", new URL(safeUrl(source.url)).hostname + (published ? " · Published " + published.label : ""));
          add(card, "p", "source-preview", sourceNoteText(source) || "Open the source to read more.");
        }
      }
      rows(body, sources.slice(0, featuredSourceLimit));
      if (sources.length > featuredSourceLimit) {
        const more = add(body, "details", "more-source-notes");
        add(more, "summary", "", "Show " + (sources.length - featuredSourceLimit) + " more sources");
        rows(more, sources.slice(featuredSourceLimit));
      }
      parent.appendChild(section);
    }

    function renderSnapshot(parent, data, observations, background, overview, leadSource) {
      const section = panel("Executive Snapshot", "▣");
      const content = add(section, "div", "panel-content");
      if (overview) {
        const quotes = checkedCompanyQuotes(overview, data);
        const exactStatement = typeof overview.text === "string" &&
          quotes.some(quote => quote.quote.includes(overview.text.trim()));
        const statement = exactStatement ? overview.text.trim() : quotes[0].quote;
        add(content, "p", "snapshot-text", statement);
        appendSourceLinks(add(content, "div", "source-row snapshot-evidence"), quotes);
      } else if (leadSource) {
        add(content, "p", "snapshot-label", "From the sources");
        add(content, "p", "snapshot-text source-preview", sourceNoteText(leadSource));
        appendSourceLinks(add(content, "div", "source-row snapshot-evidence"), [leadSource]);
      } else if (observations.length) {
        const categories = [...new Set(observations.map(item => item.category).filter(category => CATEGORIES.includes(category)))];
        const topic = categories.length ? "The selected passages cover " + categories.map(one => one.toLowerCase()).join(", ") + ". " : "";
        add(content, "p", "snapshot-text", topic + "The report does not establish when these observations occurred.");
      } else if (background.length) {
        add(content, "p", "snapshot-text", "Available evidence provides company background. Recent developments could not be established.");
      } else {
        add(content, "p", "snapshot-text", "The selected evidence is insufficient for a company overview.");
      }
      if (data.analysis_status === "partial") add(content, "p", "brief-note", "Partial analysis. Some findings could not be retained.");
      parent.appendChild(section);
    }

    function renderSignals(parent, insights) {
      const section = panel("Signal Breakdown", "▥");
      if (!insights.length) {
        add(section, "p", "empty-state", "No selected developments to classify.");
      } else {
        const body = add(section, "div", "breakdown-body");
        add(body, "p", "breakdown-note", "Categories among selected observations");
        const counts = new Map();
        for (const insight of insights) {
          const category = CATEGORIES.includes(insight.category) ? insight.category : "Unclassified";
          counts.set(category, (counts.get(category) || 0) + 1);
        }
        for (const [category, count] of [...counts].sort((a, b) => b[1] - a[1])) {
          const item = add(body, "div", "breakdown-item");
          item.setAttribute("data-category", (categoryStyles[category] || ["other"])[0]);
          const head = add(item, "div", "breakdown-item-head");
          add(head, "span", "", category);
          add(head, "strong", "", count);
          const track = add(item, "div", "breakdown-track");
          track.setAttribute("aria-hidden", "true");
          add(track, "div", "breakdown-fill").style.width = 100 * count / insights.length + "%";
        }
      }
      parent.appendChild(section);
    }

    function renderCompetitors(parent, data, comparisons) {
      const section = panel("Competitor Evidence", "⇄");
      const body = add(section, "div", "competitor-body");
      if (!comparisons.length) add(body, "p", "brief-note", "No cited comparison evidence available.");
      for (const entry of comparisons) {
        const row = add(body, "article", "competitor-entry");
        const avatar = add(row, "span", "competitor-avatar", entry.name ? entry.name.slice(0, 2).toUpperCase() : "↗");
        avatar.setAttribute("aria-hidden", "true");
        const content = add(row, "div", "competitor-content");
        add(content, "h3", "competitor-name", entry.name || "Comparison source");
        const sources = [...new Map(entry.quotes.map(quote => [quote.url, quote])).values()];
        addPassages(content, entry.quotes, "Evidence", sources);
      }
      const comparisonSources = (Array.isArray(data.comparison_sources) ? data.comparison_sources : [])
        .filter(source => safeUrl(source?.url));
      if (comparisonSources.length) {
        const reading = add(body, "details", "more-source-notes");
        reading.open = !comparisons.length;
        add(reading, "summary", "", "Comparison reading");
        const list = add(reading, "ul", "brief-note");
        for (const source of comparisonSources) {
          const link = safeLink(source, source.title || "Read comparison source", "timeline-link");
          if (link) add(list, "li").appendChild(link);
        }
      }
      for (const warning of Array.isArray(data.competitor_research_warnings) ? data.competitor_research_warnings : []) {
        add(body, "p", "brief-note", warning);
      }
      parent.appendChild(section);
    }

    function renderTimeline(parent, data) {
      const section = panel("Timeline", "◷");
      const empty = add(section, "div", "timeline-empty");
      add(empty, "strong", "", "Event dates unavailable");
      const entries = (Array.isArray(data.sources) ? data.sources : [])
        .map(source => ({source, publication: dateInfo(source?.published_at)}))
        .filter(item => item.publication && safeUrl(item.source.url))
        .sort((a, b) => b.publication.date - a.publication.date)
        .slice(0, 6);
      const detail = add(section, "details", "publication-detail");
      add(detail, "summary", "", "Source publication dates");
      if (!entries.length) add(detail, "p", "brief-note", "No publication dates are available for the collected sources.");
      else {
        const list = add(detail, "ol", "timeline");
        for (const {source, publication} of entries) {
          const row = add(list, "li");
          add(row, "div", "timeline-date", publication.label);
          const link = safeLink(source, source.title || "Read source", "timeline-link");
          if (link) row.appendChild(link);
        }
      }
      parent.appendChild(section);
    }

    function renderResearchDetails(parent, data, brief, coverage) {
      const panelNode = add(parent, "details", "panel diagnostics");
      add(panelNode, "summary", "", "Research details and source library");
      const content = add(panelNode, "div", "research-detail-grid");
      const info = add(content, "div");
      add(info, "h3", "", "Coverage and timing");
      for (const line of [coverage.title, coverage.counts, coverage.caution, coverage.evidenceNote, coverage.dateNote, ...coverage.warnings,
        ...(Array.isArray(data.context_warnings) ? data.context_warnings : [])].filter(Boolean)) add(info, "p", "brief-note", line);
      if (data.analysis_window?.start && data.analysis_window?.end) {
        add(info, "p", "brief-note", "Analysis window: " + data.analysis_window.start + " through " + data.analysis_window.end + ".");
      }
      if (dateInfo(data.generated_at)) add(info, "p", "brief-note", "Report generated " + new Date(data.generated_at).toLocaleString() + ".");
      if (Array.isArray(data.research_history) && data.research_history.length) {
        add(info, "h3", "", "Searches performed");
        const attempts = add(info, "ul", "brief-note");
        for (const attempt of data.research_history) add(attempts, "li", "", researchAttemptText(attempt));
      }
      const checks = add(content, "div");
      add(checks, "h3", "", "Research gaps");
      const gaps = add(checks, "ul", "brief-note");
      for (const gap of brief.gaps) add(gaps, "li", "", gap);
      if (brief.questions.length) {
        add(checks, "h3", "", "Questions to validate");
        const questions = add(checks, "ul", "brief-note");
        for (const question of brief.questions) add(questions, "li", "", question);
      }
      renderSourceLibrary(panelNode, brief);
    }

    function render(data, isDemo = false, researchOnly = false) {
      output.replaceChildren();
      const brief = buildCompanyBrief(data);
      const coverage = researchCoverage(data);
      const sentiment = sourceSentiment(data);
      const comparisons = comparisonEntries(data);
      const findings = companyObservations(data);
      const verified = findings.filter(item => checkedCompanyQuotes(item, data).length);
      const context = (Array.isArray(data.context_items) ? data.context_items : []).filter(item => checkedCompanyQuotes(item, data).length);
      const backgroundOnly = data.research_coverage?.status === "background_only";
      const observations = verified.filter(item => !backgroundOnly && item.temporal_status !== "historical");
      const background = [...context, ...verified.filter(item => backgroundOnly || item.temporal_status === "historical")];
      const company = data.company_name || "Company";
      const intro = add(output, "header", "brief-intro");
      add(intro, "h1", "", company);
      if (typeof data.official_domain === "string" && data.official_domain.trim()) {
        add(intro, "span", "company-domain", data.official_domain);
      }
      renderKpis(output, data, observations, background, coverage, sentiment, comparisons);

      const notices = [...analysisNotices(data)];
      if (researchOnly) notices.unshift("Analysis unavailable. The collected sources are shown below.");
      if (typeof data.offline_notice === "string" && data.offline_notice.trim()) notices.unshift(data.offline_notice.trim());
      if (data.analysis_status === "partial") notices.unshift("Partial analysis");
      if (!data.official_domain) notices.push("Company website not supplied. Identity may be ambiguous.");
      if (coverage.limited) notices.push(coverage.title, coverage.caution);
      if (notices.length) {
        const status = add(output, "div", "brief-status");
        for (const notice of new Set(notices.filter(Boolean))) add(status, "p", "", notice);
      }

      const dashboard = add(output, "div", "dashboard");
      const left = add(dashboard, "div", "main-column");
      const right = add(dashboard, "aside", "aside-column");
      const overview = background.find(item => typeof item.event === "string" && item.event.toLowerCase() === "company overview");
      // Keep every source readily visible in a sparse report. With more choices,
      // prioritize pages behind shown evidence, then readable company pages.
      const sourceNotes = brief.library.length > featuredSourceLimit
        ? [...brief.library].sort((first, second) =>
          Number(second.used || second.usedAsContext) - Number(first.used || first.usedAsContext) ||
          Number(Boolean(sourceNoteText(second))) - Number(Boolean(sourceNoteText(first))) ||
          Number(second.kind === "Company source") - Number(first.kind === "Company source"))
        : brief.library;
      const readableSources = sourceNotes.filter(sourceNoteText);
      const leadSource = readableSources.find(source => source.kind === "Company source") || readableSources[0];
      renderSnapshot(left, data, observations, background, overview, leadSource);
      const insights = panel(company + (backgroundOnly ? " · Background" : " · Insights Report"), "▤",
        (observations.length || backgroundOnly && background.length) ? "Source-linked" : "");
      const list = add(insights, "div", "insights");
      const displayed = backgroundOnly ? background : observations;
      if (displayed.length) {
        for (const item of displayed) renderObservation(list, item, data, backgroundOnly);
      } else {
        add(list, "p", "empty-state", "No source-supported developments available.");
      }
      if (data.analysis_format !== "evidence_ids_v2") {
        for (const item of findings.filter(item => !checkedCompanyQuotes(item, data).length)) {
          const note = add(list, "details", "interpretation");
          add(note, "summary", "", "Legacy analysis note");
          if (typeof item.event === "string") add(note, "h3", "", item.event);
          renderObservation(note, item, data);
        }
      }
      const leadWithFindings = displayed.length && !coverage.limited;
      if (leadWithFindings) left.appendChild(insights);
      renderSourceNotes(left, sourceNotes);
      if (!leadWithFindings) left.appendChild(insights);
      const additionalContext = background.filter(item => item !== overview);
      if (!backgroundOnly && additionalContext.length) {
        const history = panel("Historical and background context", "◷");
        const details = add(history, "div", "insights");
        for (const item of additionalContext) renderObservation(details, item, data, true);
        left.appendChild(history);
      }
      renderResearchDetails(left, data, brief, coverage);
      renderSentiment(right, sentiment);
      renderSignals(right, observations);
      renderCompetitors(right, data, comparisons);
      renderTimeline(right, data);

      output.style.display = "block";
      demoLabel.style.display = isDemo ? "block" : "none";
      latestReportData = researchOnly ? null : data;
      latestReportIsDemo = Boolean(isDemo);
      downloadReportButton.disabled = researchOnly;
      downloadEvidenceButton.disabled = researchOnly;
    }


    // ============================================
    // HTML export
    // ============================================

    function escapeHtml(value) {
      return String(value ?? "").replace(
        /[&<>"']/g,
        char => ({
          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          '"': "&quot;",
          "'": "&#39;"
        })[char]
      );
    }

    function sourceHtml(source) {
      const label = escapeHtml(
        source?.title || source?.url || "Source"
      );

      const href = safeUrl(source?.url);

      return href
        ? `<a href="${escapeHtml(href)}"
             target="_blank"
             rel="noopener noreferrer">${label}</a>`
        : label;
    }

    function evidenceHtml(evidence) {
      const quotes = (Array.isArray(evidence) ? evidence : []).filter(item =>
        typeof item?.quote === "string" && item.quote.trim() && safeUrl(item?.url)
      );
      if (!quotes.length) return "";
      return `<details><summary>Quoted source excerpts</summary>
        <p class="muted">Check whether these excerpts support the finding. Quote matching does not establish independent verification.</p>
        ${quotes.map(item => `<blockquote>${escapeHtml(item.quote)}</blockquote>${sourceHtml(item)}`).join("")}
      </details>`;
    }

    function citationsHtml(sources) {
      if (
        !Array.isArray(sources) ||
        !sources.length
      ) {
        return '<p class="muted">No citations provided.</p>';
      }

      return `
        <ul class="citations">
          ${sources.map(
            source => `<li>${sourceHtml(source)}</li>`
          ).join("")}
        </ul>
      `;
    }

    function interpretationHtml(text) {
      return `<details class="interpretation"><summary>AI interpretation — review against the excerpts</summary>
        <p>${escapeHtml(text)}</p><p class="muted">Generated wording may add details the selected excerpts do not establish. It is not independently verified.</p></details>`;
    }

    function findingHtml(item, data) {
      const view = findingPresentation(item, data);
      return `<li><h3>${escapeHtml(view.title)}</h3><p class="muted">${escapeHtml(view.label)}</p>
        <${view.quotes.length ? "blockquote" : "div"} class="report-text">${escapeHtml(view.text)}</${view.quotes.length ? "blockquote" : "div"}>
        ${citationsHtml(view.sources)}${evidenceHtml(item.evidence)}
        ${item.temporal_note ? `<p class="muted">${escapeHtml(item.temporal_note)}</p>` : ""}
        ${view.quotes.length ? interpretationHtml(item.text) : ""}</li>`;
    }

    function competitorHtml(item) {
      const quotes = competitorQuotes(item);
      return `<li><h3>${escapeHtml(item.name)}</h3>
        <p class="muted">${quotes.length ? "Comparison source excerpt" : "Quote support unavailable — generated comparison"}</p>
        ${quotes.length ? quotes.map(q => `<blockquote>${escapeHtml(q.quote)}</blockquote>`).join("") : `<p>${escapeHtml(item.overlap)}</p>`}
        ${citationsHtml(item.sources)}${evidenceHtml(item.evidence)}
        ${quotes.length ? interpretationHtml(item.overlap) : ""}</li>`;
    }

    function listHtml(items, format, emptyText) {
      if (
        !Array.isArray(items) ||
        !items.length
      ) {
        return `<p class="muted">${
          escapeHtml(emptyText)
        }</p>`;
      }

      return `
        <ol>
          ${items.map(format).join("")}
        </ol>
      `;
    }

    function buildSelectedEvidenceExport(data) {
      if (!["complete", "partial", "insufficient_evidence"].includes(data.analysis_status)) {
        throw new Error("Unavailable or malformed analysis cannot be shared as a completed brief.");
      }
      const collect = (items, comparison = false) => (Array.isArray(items) ? items : []).flatMap(record => {
        const passages = comparison ? competitorQuotes(record, data) : checkedCompanyQuotes(record, data);
        return passages.length ? [{passages: passages.map(p => ({source_id: p.source_id, evidence_id: p.evidence_id,
          quote: p.quote, title: p.title, url: p.url}))}] : [];
      });
      const observations = collect(companyObservations(data));
      const context = collect(data.context_items);
      const comparison_passages = collect(data.competitors, true);
      const sources = new Map();
      for (const item of [...observations, ...context, ...comparison_passages]) {
        for (const p of item.passages) sources.set(p.url, {title: p.title, url: p.url});
      }
      const warnings = [...analysisNotices(data), ...(Array.isArray(data.research_warnings) ? data.research_warnings : [])];
      if (observations.length < companyObservations(data).length) warnings.push("Some observations were withheld because their selected company passages could not be checked.");
      if (!observations.length) warnings.push("No selected company observations could be assembled. This brief does not establish recent developments.");
      return {kind: "marketscope-selected-evidence-export", schema_version: 1, report_mode: "selected_source_passages",
        company_name: data.company_name || "Company", analysis_status: data.analysis_status,
        analysis_window: data.analysis_window || null, generated_at: data.generated_at || null,
        offline_notice: typeof data.offline_notice === "string" ? data.offline_notice : null,
        report_status: observations.length ? "source_passages" : context.length ? "context_only" : "insufficient_evidence",
        saved_research_coverage: data.research_coverage?.status || "unknown",
        research_limits: Array.isArray(data.research_coverage?.limitations) ? data.research_coverage.limitations : [],
        observations, context, comparison_passages, sources: [...sources.values()], warnings: [...new Set(warnings)],
        limitations: ["Exact selected source passages are shown; source claims are not independently verified.",
          "Observation counts are not counts of unique material developments. Important events may be missing.",
          "The reporting window does not establish when each event happened. Unknown event timing remains uncertain.",
          "Generated interpretations, event labels, raw model reports and unselected source content are excluded from this shared brief."]};
    }

        ? `<p class="muted">Original overview window: ${escapeHtml(report.analysis_window.start)} through ${escapeHtml(report.analysis_window.end)}. This is not an event date for every observation.</p>` : "";
      return `<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<footer><p class="muted">Source titles identify documents; they are not proof of the document's claims. Comparison excerpts are supplied by the analysis service and require review against their sources.</p></footer></body></html>`;
    }

    // ============================================

    downloadReportButton.addEventListener(
      "click",
      () => {
        if (!latestReportData) {
          return;
        }

        const html = buildReportHtml(
          latestReportData,
          latestReportIsDemo
        );

        const blob = new Blob(
          [html],
          { type: "text/html;charset=utf-8" }
        );

        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");

        const company = String(
          latestReportData.company_name || "company"
        )
          .replace(/[^a-zA-Z0-9_-]/g, "-")
          .slice(0, 60);

        link.href = url;

        link.download =
          `marketscope-${company}${
            latestReportIsDemo ? "-preview" : ""
          }.html`;

        document.body.appendChild(link);
        link.click();
        link.remove();

        setTimeout(() => {
          URL.revokeObjectURL(url);
        }, 1000);
      }
    );


    // ============================================
    // API request
    // ============================================

    downloadEvidenceButton.addEventListener("click", () => {
      if (!latestReportData) return;
      const evidence = latestReportData.analysis_format === "evidence_ids_v2"
        ? {...buildSelectedEvidenceExport(latestReportData), exported_at: new Date().toISOString(), preview: latestReportIsDemo}
        : {kind: "marketscope-evidence-export", schema_version: 1,
          exported_at: new Date().toISOString(), preview: latestReportIsDemo, response: latestReportData};
      const blob = new Blob([JSON.stringify(evidence, null, 2)], {type: "application/json;charset=utf-8"});
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      const company = String(latestReportData.company_name || "company").replace(/[^a-zA-Z0-9_-]/g, "-").slice(0, 60);
      link.href = url;
      link.download = `marketscope-${company}${latestReportIsDemo ? "-preview" : ""}-evidence.json`;
      document.body.appendChild(link);
      link.click();
      link.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    });

    function apiErrorMessage(data) {
      if (typeof data?.detail === "string") return data.detail;
      if (Array.isArray(data?.detail)) {
        const fields = {company_name: "Company name", official_domain: "Company website"};
        const messages = data.detail.flatMap(item => {
          const field = Array.isArray(item?.loc) ? fields[item.loc[item.loc.length - 1]] : null;
          if (!field || typeof item.msg !== "string") return [];
          return [`${field}: ${item.msg.replace(/^Value error, /, "")}`];
        });
        if (messages.length) return [...new Set(messages)].join(" ");
      }
      return "Could not complete the analysis. Please try again.";
    }

    async function analyze() {
      const company = input.value.trim();
      const website = websiteInput.value.trim();

      if (!company || button.disabled) {
        return;
      }

      // Prevent an old report being downloaded
      // while a new analysis is running.
      latestReportData = null;
      latestReportIsDemo = false;
      downloadReportButton.disabled = true;
      downloadEvidenceButton.disabled = true;

      demoLabel.style.display = "none";
      loader.style.display = "block";
      output.style.display = "none";

      button.disabled = true;
      button.textContent = "Analyzing…";

      try {
        const response = await fetch(
          "/api/v1/analyze",
          {
            method: "POST",
            headers: {
              "Content-Type": "application/json"
            },
            body: JSON.stringify({
              company_name: company,
              official_domain: website || null
            })
          }
        );

        let data;
        try {
          data = await response.json();
        } catch {
          throw new Error("The server returned an unreadable response. Please try again.");
        }

        if (!response.ok) {
          if (response.status === 502 && Array.isArray(data?.research?.sources) &&
              data.research.sources.some(source => safeUrl(source?.url))) {
            render(data.research, false, true);
            return;
          }
          throw new Error(apiErrorMessage(data));
        }

        if (!data || data.status !== "completed") {
          throw new Error(
            "The analysis did not complete successfully."
          );
        }

        if (!["complete", "partial", "insufficient_evidence"].includes(data.analysis_status)) {
          throw new Error("The server returned an unsupported analysis status. Restart the updated backend and try again.");
        }
        const hasPrimary = (Array.isArray(data.insight_items) && data.insight_items.some(item =>
          typeof item?.text === "string" && item.text.trim() && Array.isArray(item.sources) && item.sources.some(source => safeUrl(source?.url)))) ||
          (typeof data.executive_summary?.text === "string" && data.executive_summary.text.trim() &&
            Array.isArray(data.executive_summary.sources) && data.executive_summary.sources.some(source => safeUrl(source?.url)));
        const hasSources = Array.isArray(data.sources) && data.sources.some(source => safeUrl(source?.url));
        if (data.analysis_status !== "insufficient_evidence" && !hasPrimary && !hasSources) {
          throw new Error("The analysis response contained no usable company findings. Please try again.");
        }

        render(data);

      } catch (error) {
        latestReportData = null;
        downloadReportButton.disabled = true;
        downloadEvidenceButton.disabled = true;

        output.replaceChildren();

        add(
          output,
          "p",
          "error-box",
          error?.message || "Analysis failed."
        );

        output.style.display = "block";

      } finally {
        loader.style.display = "none";
        button.disabled = false;
        button.textContent = "Analyze";
      }
    }

    form.addEventListener(
      "submit",
      event => {
        event.preventDefault();
        analyze();
      }
    );
