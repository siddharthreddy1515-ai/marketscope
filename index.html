<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MarketScope | Competitive Intelligence</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #0e1729; color: #f1f5f9; }
    .shell { max-width: 940px; margin: 0 auto; padding: 64px 24px 100px; }
    header { margin-bottom: 42px; }
    .brand { color: #38bdf8; font-size: 32px; font-weight: 750; letter-spacing: -.7px; }
    .subtitle { color: #94a3b8; margin-top: 6px; }
    .search { display: flex; gap: 12px; margin-bottom: 42px; }
    .search input { min-width: 0; flex: 1; padding: 15px 17px; border: 1px solid #34455d;
      border-radius: 11px; background: #1c2a40; color: white; font: inherit; }
    .search button { padding: 0 24px; border: 0; background: #0ea5e9; color: #061321;
      font: inherit; font-weight: 700; border-radius: 11px; cursor: pointer; }
    .search button:disabled { opacity: .55; cursor: not-allowed; }
    #loader { display: none; color: #93c5fd; margin: -20px 0 24px; }
    #output { display: none; }
    .eyebrow { color: #93c5fd; font-size: 12px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; }
    h1 { font-size: clamp(26px, 4vw, 36px); letter-spacing: -.6px; margin: 12px 0 8px; }
    .description { color: #a3b1c4; font-size: 14px; margin: 0 0 30px; }
    .insight { padding: 24px 26px; border: 1px solid #334155; border-radius: 13px;
      background: #1c293d; margin-bottom: 14px; }
    .insight-label { color: #7dd3fc; font-size: 12px; font-weight: 700; margin-bottom: 12px; }
    .insight-text { font-size: 16px; line-height: 1.75; margin: 0; }
    .sources { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 18px; }
    .source-label { color: #91a4bd; font-size: 12px; margin-right: 4px; }
    .source-chip { display: inline-flex; align-items: center; min-height: 28px; padding: 5px 11px;
      border: 1px solid #42627d; border-radius: 100px; background: #142c42;
      color: #93d5fc; text-decoration: none; font-size: 12px; line-height: 1.3; }
    .source-chip:hover, .source-chip:focus-visible { background: #1b405b; border-color: #38bdf8; }
    .empty, .error { border: 1px solid #334155; background: #1c293d; border-radius: 12px;
      padding: 24px; line-height: 1.6; }
    .empty { color: #a3b1c4; } .error { color: #fca5a5; }
    @media (max-width: 560px) { .shell { padding: 34px 16px; } .search { flex-direction: column; }
      .search button { min-height: 46px; } .insight { padding: 19px; } }
  </style>
</head>
<body>
  <div class="shell">
    <header>
      <div class="brand">MarketScope</div>
      <div class="subtitle">Competitive intelligence, backed by sources.</div>
    </header>
    <div class="search">
      <input id="companyInput" type="text" placeholder="Enter a company name" aria-label="Company name">
      <button id="generateBtn" type="button">Analyze</button>
    </div>
    <div id="loader" role="status">Researching and analyzing…</div>
    <main id="output" aria-live="polite"></main>
  </div>
  <script>
    const input = document.getElementById("companyInput");
    const button = document.getElementById("generateBtn");
    const loader = document.getElementById("loader");
    const output = document.getElementById("output");

    button.addEventListener("click", analyze);
    input.addEventListener("keydown", (event) => {
      if (event.key === "Enter") analyze();
    });

    function addText(tag, text, className, parent) {
      const el = document.createElement(tag);
      if (className) el.className = className;
      el.textContent = text;
      parent.appendChild(el);
      return el;
    }

    function render(data) {
      output.replaceChildren();
      addText("div", "Strategic intelligence", "eyebrow", output);
      addText("h1", data.company_name + " — Key insights", "", output);
      addText("p", "Selected findings from retrieved evidence. Source links appear beneath each insight.", "description", output);

      const insights = Array.isArray(data.insight_items) ? data.insight_items : [];
      if (insights.length === 0) {
        addText("div", "No source-backed insights could be presented from this research run.", "empty", output);
      }

      for (const [index, insight] of insights.entries()) {
        const section = document.createElement("section");
        section.className = "insight";
        addText("div", "INSIGHT " + (index + 1), "insight-label", section);
        addText("p", insight.text, "insight-text", section);
        const links = document.createElement("div");
        links.className = "sources";
        addText("span", "Sources", "source-label", links);

        for (const [sourceIndex, source] of insight.sources.entries()) {
          try {
            const url = new URL(source.url);
            if (!(["https:", "http:"].includes(url.protocol))) continue;
            const link = document.createElement("a");
            link.href = url.href;
            link.target = "_blank";
            link.rel = "noopener noreferrer";
            link.className = "source-chip";
            link.textContent = "Source " + (sourceIndex + 1) + " ↗";
            link.title = source.title || url.hostname;
            link.setAttribute("aria-label", "Read source: " + (source.title || url.hostname));
            links.appendChild(link);
          } catch (_) {
            // Ignore malformed links; never insert unsafe hrefs.
          }
        }
        section.appendChild(links);
        output.appendChild(section);
      }
      output.style.display = "block";
    }

    async function analyze() {
      const company = input.value.trim();
      if (!company) return alert("Please enter a company name.");
      button.disabled = true;
      button.textContent = "Analyzing…";
      loader.style.display = "block";
      output.style.display = "none";
      try {
        const response = await fetch("/api/v1/analyze", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ company_name: company })
        });
        const data = await response.json();
        if (!response.ok) throw new Error(typeof data.detail === "string" ? data.detail : "Analysis failed.");
        render(data);
      } catch (error) {
        output.replaceChildren();
        addText("p", "Error: " + error.message, "error", output);
        output.style.display = "block";
      } finally {
        button.disabled = false;
        button.textContent = "Analyze";
        loader.style.display = "none";
      }
    }
  </script>
</body>
</html>
