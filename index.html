
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b1425">

  <title>MarketScope | Competitive Intelligence</title>

  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif,
        -apple-system, BlinkMacSystemFont,
        "Segoe UI", sans-serif;

      --bg: #0b1425;
      --panel: #17243b;
      --border: #293d5b;
      --text: #e9f3ff;
      --muted: #9eafc7;
      --sky: #49b8ff;
      --green: #56d7b0;
      --gold: #f3c46b;
      --red: #e47b86;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      color: var(--text);
      background:
        radial-gradient(
          ellipse 55% 300px at 48% -120px,
          #1b3963 0%,
          transparent 100%
        ),
        var(--bg);
    }

    button,
    input {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .topbar {
      background: rgba(12, 23, 42, .92);
      border-bottom: 1px solid #243653;
    }

    .topbar-inner {
      max-width: 1340px;
      margin: auto;
      min-height: 74px;
      padding: 13px 30px;

      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 22px;
    }

    .branding {
      display: flex;
      align-items: center;
      gap: 11px;
    }

    .brand-logo {
      display: grid;
      place-items: center;

      width: 41px;
      height: 41px;

      border-radius: 12px;
      background: linear-gradient(
        140deg,
        #84ddff,
        #399eff 72%
      );

      color: #10243c;
      font-size: 22px;
      font-weight: 900;
    }

    .brand-name {
      color: var(--sky);
      font-size: 19px;
      font-weight: 760;
    }

    .brand-sub {
      margin-top: 2px;
      font-size: 11px;
      color: #a1b6cf;
    }

    .workflow-badges {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .workflow-badges span {
      padding: 7px 10px;
      font-size: 11px;
      color: #afc1d8;

      background: #14243b;
      border: 1px solid #2a405e;
      border-radius: 99px;
    }

    .workflow-badges span:first-child::before {
      content: "●";
      color: var(--green);
      margin-right: 5px;
    }

    .shell {
      max-width: 1340px;
      margin: auto;
      padding: 20px 30px 90px;
    }

    /* Search form */

    .search {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 19px;
    }

    .search input {
      min-width: 0;
      background: #15233a;
      border: 1px solid #2d4260;
      color: var(--text);

      padding: 13px 16px;
      border-radius: 9px;
      outline: none;
      font-size: 14px;
    }

    #companyInput {
      flex: 2 1 240px;
    }

    #websiteInput {
      flex: 1 1 230px;
    }

    .search input:focus {
      border-color: var(--sky);
      box-shadow: 0 0 0 3px #4ebaff22;
    }

    .search input::placeholder {
      color: #879db9;
    }

    .search button {
      background: #42b8f9;
      color: #07172b;

      padding: 0 24px;
      min-height: 45px;

      border: 0;
      border-radius: 9px;
      font-weight: 750;
    }

    .search button:hover {
      background: #73ccff;
    }

    .search button:disabled {
      opacity: .6;
      cursor: default;
    }

    #loader {
      display: none;
      padding: 0 2px 13px;
      color: #a8d9fc;
      font-size: 12px;
    }

    #output {
      display: none;
    }

    .demo-label {
      display: none;
      margin-bottom: 17px;
      padding: 11px 15px;

      background: #142c46;
      border: 1px solid #37668d;
      border-radius: 9px;

      color: #bfdef9;
      font-size: 12px;
    }

    /* KPI section */

    .kpi-grid {
      display: grid;
      grid-template-columns:
        repeat(4, minmax(0, 1fr));

      gap: 13px;
      margin-bottom: 18px;
    }

    .kpi {
      min-height: 120px;
      padding: 18px 19px;

      background: #182741;
      border: 1px solid var(--border);
      border-radius: 13px;
    }

    .kpi-label {
      color: #a3b5cd;
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: .09em;
      font-weight: 690;
    }

    .kpi-value {
      margin: 9px 0 5px;
      color: #f7faff;
      font-size: 27px;
      font-weight: 780;
    }

    .kpi-value.signal {
      color: #76ccff;
    }

    .kpi-note {
      color: #8aa2bd;
      font-size: 11px;
      line-height: 1.45;
    }

    .kpi-note.supported {
      color: #72dec1;
    }

    /* Dashboard layout */

    .dashboard {
      display: grid;
      grid-template-columns:
        minmax(0, 1.9fr)
        minmax(300px, .87fr);

      gap: 17px;
      align-items: start;
    }

    .main-column,
    .aside-column {
      min-width: 0;
      display: grid;
      gap: 17px;
    }

    .panel {
      overflow: hidden;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 14px;
    }

    .panel-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;

      padding: 18px 20px;
      border-bottom: 1px solid #293b54;
    }

    .panel-head h2 {
      margin: 0;
      font-size: 16px;
      font-weight: 750;
    }

    .panel-icon {
      display: inline-grid;
      place-items: center;

      width: 22px;
      height: 22px;
      margin-right: 8px;

      background: #28486a;
      border-radius: 6px;
      color: #8fd2ff;

      font-size: 12px;
    }

    .panel-tag {
      color: #7fe5c4;
      background: #19443e;
      border: 1px solid #28675b;

      padding: 5px 9px;
      border-radius: 99px;
      font-size: 10px;
    }

    .panel-content {
      padding: 19px 20px;
    }

    .empty-state {
      padding: 20px;
      color: #95a9c3;
      font-size: 12px;
      line-height: 1.65;
    }

    /* Insights */

    .insights {
      padding: 0 20px;
    }

    .insight {
      display: grid;
      grid-template-columns: 33px minmax(0, 1fr);
      gap: 12px;

      padding: 19px 0 21px;
      border-bottom: 1px solid #2b3e59;
    }

    .insight:last-child {
      border-bottom: 0;
    }

    .insight-icon {
      display: grid;
      place-items: center;

      width: 33px;
      height: 33px;

      background: #263e5d;
      border-radius: 9px;
      color: #95cfff;

      font-size: 12px;
      font-weight: 800;
    }

    .insight-title {
      margin: 0 0 7px;
      color: #89c8ff;
      font-size: 12px;
      font-weight: 720;
    }

    .category-chip {
      display: inline-block;
      margin-bottom: 8px;
      padding: 3px 6px;

      background: #18324d;
      border: 1px solid #365779;
      border-radius: 6px;

      color: #9fd7ff;
      font-size: 10px;
    }

    .insight-text {
      margin: 0;
      color: #dbe7f6;
      font-size: 13px;
      line-height: 1.72;
      overflow-wrap: anywhere;
    }

    /* Citations */

    .source-row {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 7px;
      margin-top: 11px;
    }

    .source-label {
      color: #829cb9;
      font-size: 10px;
    }

    .source-chip {
      color: #aedfff;
      background: #142e45;
      border: 1px solid #355c7e;

      padding: 5px 9px;
      border-radius: 7px;

      font-size: 10px;
      text-decoration: none;
    }

    .source-chip:hover {
      color: white;
      background: #235270;
    }

    /* Executive summary */

    .snapshot-label {
      margin-bottom: 10px;
      color: #85c8fa;
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
    }

    .snapshot-text {
      margin: 0;
      color: #dbe6f4;
      font-size: 12px;
      line-height: 1.75;
    }

    /* Sentiment */

    .sentiment-body {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 20px;
    }

    .empty-donut {
      position: relative;
      display: grid;
      place-items: center;

      flex-shrink: 0;
      width: 98px;
      height: 98px;

      border-radius: 50%;
      background: conic-gradient(
        #36506e 0deg 360deg
      );
    }

    .empty-donut::before {
      content: "";
      position: absolute;
      inset: 11px;
      border-radius: 50%;
      background: var(--panel);
    }

    .empty-donut span {
      position: relative;
      font-size: 22px;
      font-weight: 750;
    }

    .sentiment-legend {
      flex: 1;
      min-width: 0;
    }

    .sentiment-legend strong {
      display: block;
      margin-bottom: 6px;
      font-size: 12px;
    }

    .sentiment-legend-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;

      margin-top: 8px;
      font-size: 11px;
    }

    .sentiment-legend-label {
      display: flex;
      align-items: center;
      gap: 7px;
      color: #b1c2d8;
    }

    .sentiment-swatch {
      width: 9px;
      height: 9px;
      border-radius: 50%;
    }

    .sentiment-coverage {
      margin: 0 20px 18px;
      color: #91a6c1;
      font-size: 10px;
      line-height: 1.6;
    }

    /* Signal breakdown */

    .breakdown-body {
      padding: 16px 20px 18px;
    }

    .breakdown-note {
      margin: 0 0 13px;
      color: #93a8c2;
      font-size: 11px;
      line-height: 1.6;
    }

    .breakdown-item {
      padding: 10px 0;
      border-top: 1px solid #273b56;
    }

    .breakdown-item-head {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 7px;
      font-size: 11px;
    }

    .breakdown-track {
      width: 100%;
      height: 5px;
      overflow: hidden;
      background: #2a3e5c;
      border-radius: 99px;
    }

    .breakdown-fill {
      height: 100%;
      background: #4abaff;
      border-radius: 99px;
    }

    /* Competitors */

    .competitor-body {
      padding: 18px 20px;
    }

    .competitor-entry {
      padding: 15px 0;
      border-bottom: 1px solid #2b3e59;
    }

    .competitor-entry:first-child {
      padding-top: 0;
    }

    .competitor-entry:last-child {
      border-bottom: 0;
    }

    .competitor-name {
      margin: 0 0 7px;
      color: #dff2ff;
      font-size: 13px;
    }

    .competitor-overlap {
      margin: 0;
      color: #a9bfd9;
      font-size: 11px;
      line-height: 1.65;
    }

    /* Timeline */

    .timeline-label {
      margin: 0;
      padding: 14px 20px 0;
      color: #90a7c3;
      font-size: 11px;
      line-height: 1.6;
    }

    .timeline {
      list-style: none;
      margin: 0;
      padding: 17px 20px 14px 24px;
    }

    .timeline li {
      position: relative;
      margin-left: 5px;
      padding: 0 0 18px 18px;
      border-left: 1px solid #406587;
    }

    .timeline li:last-child {
      border-left-color: transparent;
    }

    .timeline li::before {
      content: "";
      position: absolute;
      left: -4.5px;
      top: 3px;

      width: 8px;
      height: 8px;

      background: #41bdfa;
      border-radius: 50%;
    }

    .timeline-date {
      margin-bottom: 5px;
      color: #83cdfc;
      font-size: 11px;
      font-weight: 700;
    }

    .timeline-link {
      color: #d2e3f4;
      font-size: 11px;
      line-height: 1.5;
      text-decoration: none;
      overflow-wrap: anywhere;
    }

    .timeline-link:hover {
      color: #78cbff;
      text-decoration: underline;
    }

    .coverage {
      margin-top: 12px;
      color: #8da4be;
      font-size: 11px;
      line-height: 1.6;
    }

    .error-box {
      padding: 16px;
      background: #33222d;
      border: 1px solid #98576b;
      border-radius: 10px;
      color: #ffd1d9;
    }

    @media (max-width: 790px) {
      .dashboard {
        grid-template-columns: 1fr;
      }

      .aside-column {
        grid-template-columns:
          repeat(2, minmax(0, 1fr));
      }

      .kpi-grid {
        grid-template-columns:
          repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 560px) {
      .topbar-inner {
        padding: 14px 17px;
      }

      .workflow-badges {
        display: none;
      }

      .shell {
        padding: 16px 15px 50px;
      }

      .search {
        flex-direction: column;
      }

      .search button {
        min-height: 44px;
      }

      .aside-column {
        grid-template-columns: 1fr;
      }

      .kpi-grid {
        grid-template-columns:
          repeat(2, minmax(0, 1fr));
      }
    }
  </style>
</head>

<body>

  <header class="topbar">
    <div class="topbar-inner">

      <div class="branding">
        <div class="brand-logo" aria-hidden="true">
          ↗
        </div>

        <div>
          <div class="brand-name">
            MarketScope
          </div>

          <div class="brand-sub">
            Competitive Intelligence
          </div>
        </div>
      </div>

      <div
        class="workflow-badges"
        aria-label="MarketScope workflow"
      >
        <span>Evidence-linked</span>
        <span>Research</span>
        <span>Analysis</span>
        <span>Report</span>
      </div>

    </div>
  </header>

  <div class="shell">

    <form id="searchForm" class="search">

      <input
        id="companyInput"
        type="text"
        placeholder="Search company (e.g. Linear)"
        aria-label="Company name"
        maxlength="50"
        autocomplete="off"
        required
      >

      <input
        id="websiteInput"
        type="text"
        placeholder="Official website (optional, e.g. linear.app)"
        aria-label="Official company website (optional)"
        autocomplete="off"
      >

      <button
        type="submit"
        id="analyzeBtn"
      >
        Analyze
      </button>

    </form>

    <div id="demoLabel" class="demo-label">
      Preview mode — fictional ExampleCo sample data.
      No Tavily or GPT-4o request was made.
    </div>

    <div
      id="loader"
      role="status"
      aria-live="polite"
    >
      Researching and analyzing company evidence…
    </div>

    <main
      id="output"
      aria-live="polite"
    ></main>

  </div>

  <script>
    // ============================================
    // DOM references
    // ============================================

    const form = document.getElementById(
      "searchForm"
    );

    const input = document.getElementById(
      "companyInput"
    );

    const websiteInput = document.getElementById(
      "websiteInput"
    );

    const button = document.getElementById(
      "analyzeBtn"
    );

    const loader = document.getElementById(
      "loader"
    );

    const output = document.getElementById(
      "output"
    );

    const demoLabel = document.getElementById(
      "demoLabel"
    );

    const CATEGORIES = [
      "Product & Innovation",
      "Funding & Investment",
      "M&A / Partnerships",
      "Market Expansion",
      "Hiring & Talent",
      "Other"
    ];


    // ============================================
    // DOM utilities
    // ============================================

    function el(tag, cls = "", text) {
      const node = document.createElement(tag);

      if (cls) {
        node.className = cls;
      }

      if (text !== undefined) {
        node.textContent = String(text);
      }

      return node;
    }


    function add(parent, tag, cls = "", text) {
      const node = el(tag, cls, text);
      parent.appendChild(node);
      return node;
    }


    function safeLink(
      source,
      label,
      cls = "source-chip"
    ) {
      if (
        !source ||
        typeof source.url !== "string"
      ) {
        return null;
      }

      let parsed;

      try {
        parsed = new URL(source.url);
      } catch (_) {
        return null;
      }

      if (
        !["http:", "https:"].includes(
          parsed.protocol
        )
      ) {
        return null;
      }

      const link = el(
        "a",
        cls,
        label
      );

      link.href = parsed.href;
      link.target = "_blank";
      link.rel = "noopener noreferrer";

      link.title = (
        source.title || parsed.href
      );

      return link;
    }


    function appendSourceLinks(
      parent,
      sources,
      onValidSource
    ) {
      const validSources = Array.isArray(sources)
        ? sources
        : [];

      let count = 0;

      for (const source of validSources) {
        const link = safeLink(
          source,
          `Source ${count + 1} ↗`
        );

        if (!link) {
          continue;
        }

        if (count === 0) {
          add(
            parent,
            "span",
            "source-label",
            "Evidence"
          );
        }

        parent.appendChild(link);

        if (onValidSource) {
          onValidSource(source);
        }

        count += 1;
      }

      return count;
    }


    function dateInfo(value) {
      if (!value) {
        return null;
      }

      const parsed = new Date(value);

      if (Number.isNaN(parsed.getTime())) {
        return null;
      }

      return {
        date: parsed,
        label: new Intl.DateTimeFormat(
          "en-GB",
          {
            day: "numeric",
            month: "short",
            year: "numeric",
            timeZone: "UTC"
          }
        ).format(parsed)
      };
    }


    function panel(
      title,
      symbol,
      extra = ""
    ) {
      const section = el(
        "section",
        "panel"
      );

      const header = add(
        section,
        "div",
        "panel-head"
      );

      const heading = add(
        header,
        "h2"
      );

      add(
        heading,
        "span",
        "panel-icon",
        symbol
      );

      heading.appendChild(
        document.createTextNode(title)
      );

      if (extra) {
        add(
          header,
          "span",
          "panel-tag",
          extra
        );
      }

      return section;
    }


    // ============================================
    // Dashboard rendering
    // ============================================

    function render(
      data,
      isDemo = false
    ) {
      output.replaceChildren();

      const insights = Array.isArray(
        data.insight_items
      )
        ? data.insight_items
        : [];

      const allSources = Array.isArray(
        data.sources
      )
        ? data.sources
        : [];

      const cited = new Map();


      // ----------------------------------------
      // KPI cards
      // ----------------------------------------

      const stats = [
        [
          "Market Position",
          "—",
          "Not assessed"
        ],
        [
          "Insights Found",
          insights.length,
          "Source-backed findings",
          "signal"
        ],
        [
          "Sentiment",
          "—",
          "See source coverage below"
        ],
        [
          "Threat Level",
          "—",
          "Not assessed"
        ]
      ];

      const cards = add(
        output,
        "section",
        "kpi-grid"
      );

      cards.setAttribute(
        "aria-label",
        "Competitive intelligence overview"
      );

      for (
        const [label, value, note, cls]
        of stats
      ) {
        const card = add(
          cards,
          "article",
          "kpi"
        );

        add(
          card,
          "div",
          "kpi-label",
          label
        );

        add(
          card,
          "div",
          `kpi-value ${cls || ""}`,
          value
        );

        add(
          card,
          "div",
          "kpi-note",
          note
        );
      }


      // ----------------------------------------
      // Dashboard columns
      // ----------------------------------------

      const dashboard = add(
        output,
        "div",
        "dashboard"
      );

      const left = add(
        dashboard,
        "div",
        "main-column"
      );

      const right = add(
        dashboard,
        "aside",
        "aside-column"
      );


      // ----------------------------------------
      // Strategic insights
      // ----------------------------------------

      const insightsPanel = panel(
        `${data.company_name || "Company"} — Insights Report`,
        "▤",
        "Source-linked"
      );

      const insightList = add(
        insightsPanel,
        "div",
        "insights"
      );

      insights.forEach(
        (insight, index) => {
          const item = add(
            insightList,
            "article",
            "insight"
          );

          add(
            item,
            "div",
            "insight-icon",
            String(index + 1).padStart(
              2,
              "0"
            )
          );

          const body = add(
            item,
            "div"
          );

          add(
            body,
            "div",
            "insight-title",
            `STRATEGIC FINDING ${index + 1}`
          );

          const category = CATEGORIES.includes(
            insight.category
          )
            ? insight.category
            : "Other";

          add(
            body,
            "div",
            "category-chip",
            category
          );

          add(
            body,
            "p",
            "insight-text",
            insight.text || ""
          );

          const linkRow = add(
            body,
            "div",
            "source-row"
          );

          appendSourceLinks(
            linkRow,
            insight.sources,
            source => {
              cited.set(
                source.url,
                source
              );
            }
          );
        }
      );

      if (!insights.length) {
        add(
          insightList,
          "p",
          "empty-state",
          "No source-backed strategic insights were identified."
        );
      }

      left.appendChild(
        insightsPanel
      );


      // ----------------------------------------
      // Executive snapshot
      // ----------------------------------------

      const summaryPanel = panel(
        "Executive Snapshot",
        "▣"
      );

      const summaryBody = add(
        summaryPanel,
        "div",
        "panel-content"
      );

      const summary = (
        data.executive_summary
      );

      const summarySources = (
        summary &&
        Array.isArray(summary.sources)
      )
        ? summary.sources
        : [];

      if (
        summary &&
        typeof summary.text === "string" &&
        summary.text.trim() &&
        summarySources.length
      ) {
        add(
          summaryBody,
          "div",
          "snapshot-label",
          "STRATEGIC OVERVIEW"
        );

        add(
          summaryBody,
          "p",
          "snapshot-text",
          summary.text
        );

        const row = add(
          summaryBody,
          "div",
          "source-row"
        );

        appendSourceLinks(
          row,
          summarySources,
          source => {
            cited.set(
              source.url,
              source
            );
          }
        );
      } else {
        add(
          summaryBody,
          "p",
          "snapshot-text",
          "No source-backed executive summary is available."
        );
      }

      left.appendChild(
        summaryPanel
      );


      // ----------------------------------------
      // Source sentiment
      // ----------------------------------------

      const sentimentPanel = panel(
        "Sentiment",
        "◉"
      );

      const sentimentBody = add(
        sentimentPanel,
        "div",
        "sentiment-body"
      );

      const donut = add(
        sentimentBody,
        "div",
        "empty-donut"
      );

      const sentimentLegend = add(
        sentimentBody,
        "div",
        "sentiment-legend"
      );

      const distribution = (
        data.sentiment_distribution
      );

      const fields = [
        "positive",
        "neutral",
        "negative",
        "assessed",
        "unassessed",
        "total_sources"
      ];

      const validDistribution = (
        distribution &&
        fields.every(
          key =>
            Number.isInteger(
              distribution[key]
            ) &&
            distribution[key] >= 0
        ) &&
        distribution.assessed > 0 &&
        distribution.assessed === (
          distribution.positive +
          distribution.neutral +
          distribution.negative
        ) &&
        distribution.total_sources === (
          distribution.assessed +
          distribution.unassessed
        )
      );

      if (validDistribution) {
        const total = (
          distribution.assessed
        );

        const positivePct = (
          100 *
          distribution.positive /
          total
        );

        const neutralPct = (
          100 *
          distribution.neutral /
          total
        );

        const neutralEnd = (
          positivePct + neutralPct
        );

        donut.style.background = `
          conic-gradient(
            #56d7b0 0% ${positivePct}%,
            #f3c46b ${positivePct}% ${neutralEnd}%,
            #e47b86 ${neutralEnd}% 100%
          )
        `;

        add(
          donut,
          "span",
          "",
          `${total}/${distribution.total_sources}`
        );

        add(
          sentimentLegend,
          "strong",
          "",
          "Retrieved source coverage"
        );

        const groups = [
          {
            name: "Positive",
            count: distribution.positive,
            color: "#56d7b0"
          },
          {
            name: "Neutral",
            count: distribution.neutral,
            color: "#f3c46b"
          },
          {
            name: "Negative",
            count: distribution.negative,
            color: "#e47b86"
          }
        ];

        for (const group of groups) {
          const percent = Math.round(
            100 *
            group.count /
            total
          );

          const row = add(
            sentimentLegend,
            "div",
            "sentiment-legend-row"
          );

          const label = add(
            row,
            "span",
            "sentiment-legend-label"
          );

          const swatch = add(
            label,
            "span",
            "sentiment-swatch"
          );

          swatch.style.background = (
            group.color
          );

          add(
            label,
            "span",
            "",
            group.name
          );

          add(
            row,
            "span",
            "",
            `${group.count} · ${percent}%`
          );
        }

        add(
          sentimentPanel,
          "p",
          "sentiment-coverage",
          `${total} of ${distribution.total_sources} retrieved sources assessed. ` +
          `${distribution.unassessed} unassessed. ` +
          "Percentages describe assessed sources only."
        );

      } else {
        add(
          donut,
          "span",
          "",
          "—"
        );

        add(
          sentimentLegend,
          "strong",
          "",
          "Not assessed"
        );

        add(
          sentimentLegend,
          "p",
          "",
          "No usable source-level sentiment distribution is available."
        );
      }

      right.appendChild(
        sentimentPanel
      );


      // ----------------------------------------
      // Signal breakdown
      // ----------------------------------------

      const breakdownPanel = panel(
        "Signal Breakdown",
        "▥"
      );

      const breakdownBody = add(
        breakdownPanel,
        "div",
        "breakdown-body"
      );

      if (!insights.length) {
        add(
          breakdownBody,
          "p",
          "breakdown-note",
          "No source-backed insights available to classify."
        );

      } else {
        add(
          breakdownBody,
          "p",
          "breakdown-note",
          "Share of findings in this report, not company-wide activity."
        );

        const counts = Object.fromEntries(
          CATEGORIES.map(
            category => [
              category,
              0
            ]
          )
        );

        for (const insight of insights) {
          const category = (
            CATEGORIES.includes(
              insight.category
            )
          )
            ? insight.category
            : "Other";

          counts[category] += 1;
        }

        for (const category of CATEGORIES) {
          const count = counts[category];

          const percent = Math.round(
            100 *
            count /
            insights.length
          );

          const row = add(
            breakdownBody,
            "div",
            "breakdown-item"
          );

          const heading = add(
            row,
            "div",
            "breakdown-item-head"
          );

          add(
            heading,
            "span",
            "",
            category
          );

          add(
            heading,
            "span",
            "",
            `${count} · ${percent}%`
          );

          const track = add(
            row,
            "div",
            "breakdown-track"
          );

          const fill = add(
            track,
            "div",
            "breakdown-fill"
          );

          fill.style.width = (
            `${percent}%`
          );
        }
      }

      right.appendChild(
        breakdownPanel
      );


      // ----------------------------------------
      // Competitor intelligence
      // ----------------------------------------

      const competitorsPanel = panel(
        "Relevant Competitors",
        "⇄"
      );

      const competitorBody = add(
        competitorsPanel,
        "div",
        "competitor-body"
      );

      const records = Array.isArray(
        data.competitors
      )
        ? data.competitors
        : [];

      let displayed = 0;

      for (const record of records) {
        if (
          !record ||
          typeof record.name !== "string" ||
          !record.name.trim() ||
          typeof record.overlap !== "string" ||
          !record.overlap.trim()
        ) {
          continue;
        }

        const sourceLinks = [];

        const recordSources = (
          Array.isArray(record.sources)
        )
          ? record.sources
          : [];

        for (const source of recordSources) {
          const link = safeLink(
            source,
            `Source ${sourceLinks.length + 1} ↗`
          );

          if (link) {
            sourceLinks.push(link);
          }
        }

        if (!sourceLinks.length) {
          continue;
        }

        const entry = add(
          competitorBody,
          "article",
          "competitor-entry"
        );

        add(
          entry,
          "h3",
          "competitor-name",
          record.name
        );

        add(
          entry,
          "p",
          "competitor-overlap",
          record.overlap
        );

        const row = add(
          entry,
          "div",
          "source-row"
        );

        add(
          row,
          "span",
          "source-label",
          "Evidence"
        );

        for (const link of sourceLinks) {
          row.appendChild(link);
        }

        displayed += 1;
      }

      if (!displayed) {
        add(
          competitorBody,
          "p",
          "competitor-overlap",
          "No evidence-backed competitors were identified."
        );
      }

      right.appendChild(
        competitorsPanel
      );


      // ----------------------------------------
      // Evidence timeline
      // ----------------------------------------

      const timelinePanel = panel(
        "Timeline",
        "◷"
      );

      add(
        timelinePanel,
        "p",
        "timeline-label",
        "Publication dates of cited sources, not necessarily company event dates."
      );

      const dates = new Map(
        allSources
          .filter(
            source =>
              source &&
              typeof source.url === "string"
          )
          .map(
            source => [
              source.url,
              source.published_at
            ]
          )
      );

      const entries = [
        ...cited.values()
      ]
        .map(source => {
          const info = dateInfo(
            dates.get(source.url)
          );

          return info
            ? {
                source,
                ...info
              }
            : null;
        })
        .filter(Boolean)
        .sort(
          (a, b) => b.date - a.date
        )
        .slice(0, 6);

      if (entries.length) {
        const timeline = add(
          timelinePanel,
          "ol",
          "timeline"
        );

        for (const item of entries) {
          const entry = add(
            timeline,
            "li"
          );

          add(
            entry,
            "div",
            "timeline-date",
            item.label
          );

          const link = safeLink(
            item.source,
            item.source.title || "Read source",
            "timeline-link"
          );

          if (link) {
            entry.appendChild(link);
          }
        }

      } else {
        add(
          timelinePanel,
          "p",
          "empty-state",
          "No publication dates are available for cited sources."
        );
      }

      right.appendChild(
        timelinePanel
      );


      // ----------------------------------------
      // Coverage limitation
      // ----------------------------------------

      add(
        output,
        "p",
        "coverage",
        "Insights reflect retrieved evidence, not a comprehensive record. Open citations to verify facts and dates."
      );

      output.style.display = "block";

      demoLabel.style.display = (
        isDemo
          ? "block"
          : "none"
      );
    }


    // ============================================
    // API request
    // ============================================

    async function analyze() {
      const company = input.value.trim();

      const website = (
        websiteInput.value.trim()
      );

      if (
        !company ||
        button.disabled
      ) {
        return;
      }

      demoLabel.style.display = "none";
      loader.style.display = "block";
      output.style.display = "none";

      button.disabled = true;
      button.textContent = "Analyzing…";

      try {
        const response = await fetch(
          "/api/v1/analyze",
          {
            method: "POST",
            headers: {
              "Content-Type": "application/json"
            },
            body: JSON.stringify({
              company_name: company,
              official_domain: website || null
            })
          }
        );

        const data = await response.json();

        if (!response.ok) {
          throw new Error(
            typeof data.detail === "string"
              ? data.detail
              : "Could not complete the analysis."
          );
        }

        render(data);

      } catch (error) {
        output.replaceChildren();

        add(
          output,
          "p",
          "error-box",
          error && error.message
            ? error.message
            : "Analysis failed."
        );

        output.style.display = "block";

      } finally {
        loader.style.display = "none";
        button.disabled = false;
        button.textContent = "Analyze";
      }
    }


    form.addEventListener(
      "submit",
      event => {
        event.preventDefault();
        analyze();
      }
    );


    // ============================================
    // Development-only preview
    // ============================================

    if (
      new URLSearchParams(
        location.search
      ).get("preview") === "1"
    ) {
      input.value = "ExampleCo";
      websiteInput.value = "";

      const demoSource1 = {
        title: "Fictional partnership announcement",
        url: "https://example.com/demo-partnership"
      };

      const demoSource2 = {
        title: "Fictional product announcement",
        url: "https://example.com/demo-product"
      };

      const demoSource3 = {
        title: "Fictional integration announcement",
        url: "https://example.com/demo-integration"
      };

      render({
        company_name: "ExampleCo",

        executive_summary: {
          text:
            "In this fictional example, ExampleCo announced partnerships and introduced a reporting product. These developments do not establish market leadership or business impact.",
          sources: [
            demoSource1,
            demoSource2,
            demoSource3
          ]
        },

        insight_items: [
          {
            category: "M&A / Partnerships",
            text:
              "Fictional ExampleCo announced an analytics integration partnership with Northstar Labs.",
            sources: [demoSource1]
          },
          {
            category: "Product & Innovation",
            text:
              "Fictional ExampleCo introduced a reporting dashboard.",
            sources: [demoSource2]
          },
          {
            category: "M&A / Partnerships",
            text:
              "Fictional ExampleCo announced a data integration partnership with Harbor Data.",
            sources: [demoSource3]
          }
        ],

        competitors: [
          {
            name: "Summit Metrics",
            overlap:
              "In this fictional example, both companies provide analytics dashboards for small businesses.",
            sources: [
              {
                title:
                  "Fictional analytics market comparison",
                url:
                  "https://example.com/demo-competitor-1"
              }
            ]
          },
          {
            name: "Pioneer BI",
            overlap:
              "In this fictional example, both companies offer customer reporting tools.",
            sources: [
              {
                title:
                  "Fictional reporting software comparison",
                url:
                  "https://example.com/demo-competitor-2"
              }
            ]
          }
        ],

        sentiment_distribution: {
          positive: 0,
          neutral: 3,
          negative: 0,
          assessed: 3,
          unassessed: 0,
          total_sources: 3
        },

        sources: [
          {
            ...demoSource1,
            published_at: "2026-09-15"
          },
          {
            ...demoSource2,
            published_at: "2026-09-21"
          },
          {
            ...demoSource3,
            published_at: "2026-10-03"
          }
        ]
      }, true);
    }
  </script>
</body>
</html>
