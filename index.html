
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b1425">
  <title>MarketScope | Competitive Intelligence</title>

  <style>
    :root {
      font-family: Inter, ui-sans-serif, system-ui, sans-serif;
      color-scheme: dark;
      --bg: #0b1425;
      --panel: #17243b;
      --border: #293d5b;
      --text: #e9f3ff;
      --muted: #9eafc7;
      --sky: #49b8ff;
      --green: #56d7b0;
      --gold: #f3c46b;
      --red: #e47b86;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: radial-gradient(
        ellipse 55% 300px at 48% -120px,
        #1b3963 0%, transparent 100%
      ), var(--bg);
      color: var(--text);
    }

    button, input { font: inherit; }
    button { cursor: pointer; }

    .topbar {
      background: rgba(12, 23, 42, .92);
      border-bottom: 1px solid #243653;
    }

    .topbar-inner {
      max-width: 1340px;
      margin: auto;
      min-height: 74px;
      padding: 13px 30px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 22px;
    }

    .branding {
      display: flex;
      align-items: center;
      gap: 11px;
    }

    .brand-logo {
      width: 41px;
      height: 41px;
      border-radius: 12px;
      background: linear-gradient(140deg, #84ddff, #399eff 72%);
      display: grid;
      place-items: center;
      color: #10243c;
      font-size: 22px;
      font-weight: 900;
    }

    .brand-name {
      color: var(--sky);
      font-size: 19px;
      font-weight: 760;
    }

    .brand-sub {
      margin-top: 2px;
      font-size: 11px;
      color: #a1b6cf;
    }

    .workflow-badges {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .workflow-badges span {
      padding: 7px 10px;
      font-size: 11px;
      color: #afc1d8;
      background: #14243b;
      border: 1px solid #2a405e;
      border-radius: 99px;
    }

    .workflow-badges span:first-child::before {
      content: "●";
      color: var(--green);
      margin-right: 5px;
    }

    .shell {
      max-width: 1340px;
      margin: auto;
      padding: 20px 30px 90px;
    }

    .search {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 10px;
    }

    .search input {
      min-width: 0;
      background: #15233a;
      border: 1px solid #2d4260;
      color: var(--text);
      padding: 13px 16px;
      border-radius: 9px;
      outline: none;
      font-size: 14px;
    }

    #companyInput { flex: 2 1 240px; }
    #websiteInput { flex: 1 1 230px; }

    .search input:focus {
      border-color: var(--sky);
      box-shadow: 0 0 0 3px #4ebaff22;
    }

    .search input::placeholder { color: #879db9; }

    .search button {
      padding: 0 24px;
      min-height: 45px;
      border: 0;
      border-radius: 9px;
      font-weight: 750;
      background: #42b8f9;
      color: #07172b;
    }

    .search button:hover { background: #73ccff; }
    .search button:disabled {
      opacity: .6;
      cursor: default;
    }

    /* HTML export button */

    .export-actions {
      display: flex;
      justify-content: flex-end;
      margin: 0 0 19px;
    }

    .export-actions button {
      padding: 10px 16px;
      border: 1px solid #426182;
      border-radius: 9px;
      background: #172d46;
      color: #cbe9ff;
      font-size: 13px;
      font-weight: 650;
    }

    .export-actions button:hover:not(:disabled) {
      background: #264a6a;
      border-color: #68bfff;
    }

    .export-actions button:disabled {
      opacity: .45;
      cursor: not-allowed;
    }

    #loader {
      display: none;
      padding: 0 2px 13px;
      color: #a8d9fc;
      font-size: 12px;
    }

    #output, .demo-label { display: none; }

    .demo-label {
      margin-bottom: 17px;
      padding: 11px 15px;
      background: #142c46;
      border: 1px solid #37668d;
      border-radius: 9px;
      color: #bfdef9;
      font-size: 12px;
    }

    /* KPI cards */

    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 13px;
      margin-bottom: 18px;
    }

    .kpi {
      min-height: 120px;
      padding: 18px 19px;
      background: #182741;
      border: 1px solid var(--border);
      border-radius: 13px;
    }

    .kpi-label {
      color: #a3b5cd;
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: .09em;
      font-weight: 690;
    }

    .kpi-value {
      margin: 9px 0 5px;
      color: #f7faff;
      font-size: 27px;
      font-weight: 780;
    }

    .kpi-value.signal { color: #76ccff; }

    .kpi-note {
      color: #8aa2bd;
      font-size: 11px;
      line-height: 1.45;
    }

    /* Dashboard panels */

    .dashboard {
      display: grid;
      grid-template-columns: minmax(0, 1.9fr) minmax(300px, .87fr);
      gap: 17px;
      align-items: start;
    }

    .main-column, .aside-column {
      min-width: 0;
      display: grid;
      gap: 17px;
    }

    .panel {
      overflow: hidden;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 14px;
    }

    .panel-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 18px 20px;
      border-bottom: 1px solid #293b54;
    }

    .panel-head h2 {
      margin: 0;
      font-size: 16px;
      font-weight: 750;
    }

    .panel-icon {
      display: inline-grid;
      place-items: center;
      width: 22px;
      height: 22px;
      margin-right: 8px;
      background: #28486a;
      border-radius: 6px;
      color: #8fd2ff;
      font-size: 12px;
    }

    .panel-tag {
      color: #7fe5c4;
      background: #19443e;
      border: 1px solid #28675b;
      padding: 5px 9px;
      border-radius: 99px;
      font-size: 10px;
    }

    .panel-content { padding: 19px 20px; }

    .empty-state {
      padding: 20px;
      color: #95a9c3;
      font-size: 12px;
      line-height: 1.65;
    }

    /* Strategic insights */

    .insights { padding: 0 20px; }

    .insight {
      display: grid;
      grid-template-columns: 33px minmax(0, 1fr);
      gap: 12px;
      padding: 19px 0 21px;
      border-bottom: 1px solid #2b3e59;
    }

    .insight:last-child { border-bottom: 0; }

    .insight-icon {
      display: grid;
      place-items: center;
      width: 33px;
      height: 33px;
      background: #263e5d;
      border-radius: 9px;
      color: #95cfff;
      font-size: 12px;
      font-weight: 800;
    }

    .insight-title {
      margin: 0 0 7px;
      color: #89c8ff;
      font-size: 12px;
      font-weight: 720;
    }

    .category-chip {
      display: inline-block;
      margin-bottom: 8px;
      padding: 3px 6px;
      background: #18324d;
      border: 1px solid #365779;
      border-radius: 6px;
      color: #9fd7ff;
      font-size: 10px;
    }

    .insight-text {
      margin: 0;
      color: #dbe7f6;
      font-size: 13px;
      line-height: 1.72;
      overflow-wrap: anywhere;
    }

    /* Citations */

    .source-row {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 7px;
      margin-top: 11px;
    }

    .source-label {
      color: #829cb9;
      font-size: 10px;
    }

    .source-chip {
      color: #aedfff;
      background: #142e45;
      border: 1px solid #355c7e;
      padding: 5px 9px;
      border-radius: 7px;
      font-size: 10px;
      text-decoration: none;
    }

    .source-chip:hover {
      color: white;
      background: #235270;
    }

    /* Executive summary */

    .snapshot-label {
      margin-bottom: 10px;
      color: #85c8fa;
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
    }

    .snapshot-text {
      margin: 0;
      color: #dbe6f4;
      font-size: 12px;
      line-height: 1.75;
    }

    /* Sentiment */

    .sentiment-body {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 20px;
    }

    .empty-donut {
      position: relative;
      display: grid;
      place-items: center;
      flex-shrink: 0;
      width: 98px;
      height: 98px;
      border-radius: 50%;
      background: conic-gradient(#36506e 0deg 360deg);
    }

    .empty-donut::before {
      content: "";
      position: absolute;
      inset: 11px;
      border-radius: 50%;
      background: var(--panel);
    }

    .empty-donut span {
      position: relative;
      font-size: 22px;
      font-weight: 750;
    }

    .sentiment-legend {
      flex: 1;
      min-width: 0;
    }

    .sentiment-legend strong {
      display: block;
      margin-bottom: 6px;
      font-size: 12px;
    }

    .sentiment-legend-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-top: 8px;
      font-size: 11px;
    }

    .sentiment-legend-label {
      display: flex;
      align-items: center;
      gap: 7px;
      color: #b1c2d8;
    }

    .sentiment-swatch {
      width: 9px;
      height: 9px;
      border-radius: 50%;
    }

    .sentiment-coverage {
      margin: 0 20px 18px;
      color: #91a6c1;
      font-size: 10px;
      line-height: 1.6;
    }

    /* Signal breakdown */

    .breakdown-body { padding: 16px 20px 18px; }

    .breakdown-note {
      margin: 0 0 13px;
      color: #93a8c2;
      font-size: 11px;
      line-height: 1.6;
    }

    .breakdown-item {
      padding: 10px 0;
      border-top: 1px solid #273b56;
    }

    .breakdown-item-head {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 7px;
      font-size: 11px;
    }

    .breakdown-track {
      width: 100%;
      height: 5px;
      overflow: hidden;
      background: #2a3e5c;
      border-radius: 99px;
    }

    .breakdown-fill {
      height: 100%;
      background: #4abaff;
      border-radius: 99px;
    }

    /* Competitors */

    .competitor-body { padding: 18px 20px; }

    .competitor-entry {
      padding: 15px 0;
      border-bottom: 1px solid #2b3e59;
    }

    .competitor-entry:first-child { padding-top: 0; }
    .competitor-entry:last-child { border-bottom: 0; }

    .competitor-name {
      margin: 0 0 7px;
      color: #dff2ff;
      font-size: 13px;
    }

    .competitor-overlap {
      margin: 0;
      color: #a9bfd9;
      font-size: 11px;
      line-height: 1.65;
    }

    /* Timeline */

    .timeline-label {
      margin: 0;
      padding: 14px 20px 0;
      color: #90a7c3;
      font-size: 11px;
      line-height: 1.6;
    }

    .timeline {
      list-style: none;
      margin: 0;
      padding: 17px 20px 14px 24px;
    }

    .timeline li {
      position: relative;
      margin-left: 5px;
      padding: 0 0 18px 18px;
      border-left: 1px solid #406587;
    }

    .timeline li:last-child {
      border-left-color: transparent;
    }

    .timeline li::before {
      content: "";
      position: absolute;
      left: -4.5px;
      top: 3px;
      width: 8px;
      height: 8px;
      background: #41bdfa;
      border-radius: 50%;
    }

    .timeline-date {
      margin-bottom: 5px;
      color: #83cdfc;
      font-size: 11px;
      font-weight: 700;
    }

    .timeline-link {
      color: #d2e3f4;
      font-size: 11px;
      line-height: 1.5;
      text-decoration: none;
      overflow-wrap: anywhere;
    }

    .timeline-link:hover {
      color: #78cbff;
      text-decoration: underline;
    }

    .coverage {
      margin-top: 12px;
      color: #8da4be;
      font-size: 11px;
      line-height: 1.6;
    }

    .error-box {
      padding: 16px;
      background: #33222d;
      border: 1px solid #98576b;
      border-radius: 10px;
      color: #ffd1d9;
    }

    @media (max-width: 790px) {
      .dashboard { grid-template-columns: 1fr; }
      .aside-column {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
      .kpi-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 560px) {
      .topbar-inner { padding: 14px 17px; }
      .workflow-badges { display: none; }
      .shell { padding: 16px 15px 50px; }
      .search { flex-direction: column; }
      .search button { min-height: 44px; }
      .aside-column { grid-template-columns: 1fr; }
    }
  </style>
</head>

<body>

  <header class="topbar">
    <div class="topbar-inner">
      <div class="branding">
        <div class="brand-logo" aria-hidden="true">↗</div>
        <div>
          <div class="brand-name">MarketScope</div>
          <div class="brand-sub">Competitive Intelligence</div>
        </div>
      </div>

      <div class="workflow-badges" aria-label="MarketScope workflow">
        <span>Evidence-linked</span>
        <span>Research</span>
        <span>Analysis</span>
        <span>Report</span>
      </div>
    </div>
  </header>

  <div class="shell">

    <form id="searchForm" class="search">
      <input
        id="companyInput"
        type="text"
        placeholder="Search company (e.g. Linear)"
        aria-label="Company name"
        maxlength="50"
        autocomplete="off"
        required
      >

      <input
        id="websiteInput"
        type="text"
        placeholder="Official website (optional, e.g. linear.app)"
        aria-label="Official company website (optional)"
        autocomplete="off"
      >

      <button type="submit" id="analyzeBtn">
        Analyze
      </button>
    </form>

    <div class="export-actions">
      <button
        type="button"
        id="downloadReportButton"
        disabled
      >
        Download HTML Report
      </button>
    </div>

    <div id="demoLabel" class="demo-label">
      Preview mode — fictional ExampleCo sample data.
      No Tavily or GPT-4o request was made.
    </div>

    <div id="loader" role="status" aria-live="polite">
      Researching and analyzing company evidence…
    </div>

    <main id="output" aria-live="polite"></main>

  </div>

  <script>
    // ============================================
    // DOM references
    // ============================================

    const form = document.getElementById("searchForm");
    const input = document.getElementById("companyInput");
    const websiteInput = document.getElementById("websiteInput");
    const button = document.getElementById("analyzeBtn");
    const loader = document.getElementById("loader");
    const output = document.getElementById("output");
    const demoLabel = document.getElementById("demoLabel");

    const downloadReportButton =
      document.getElementById("downloadReportButton");

    const CATEGORIES = [
      "Product & Innovation",
      "Funding & Investment",
      "M&A / Partnerships",
      "Market Expansion",
      "Hiring & Talent",
      "Other"
    ];

    // Keep only the current completed analysis.
    let latestReportData = null;
    let latestReportIsDemo = false;


    // ============================================
    // Safe DOM utilities
    // ============================================

    function el(tag, cls = "", text) {
      const node = document.createElement(tag);

      if (cls) {
        node.className = cls;
      }

      if (text !== undefined) {
        node.textContent = String(text);
      }

      return node;
    }

    function add(parent, tag, cls = "", text) {
      const node = el(tag, cls, text);
      parent.appendChild(node);
      return node;
    }

    function safeUrl(value) {
      try {
        const parsed = new URL(value);

        return ["http:", "https:"].includes(parsed.protocol)
          ? parsed.href
          : null;
      } catch {
        return null;
      }
    }

    function safeLink(source, text, cls = "source-chip") {
      const href = safeUrl(source?.url);

      if (!href) {
        return null;
      }

      const link = el(
        "a",
        cls,
        text || source?.title || "Read source"
      );

      link.href = href;
      link.target = "_blank";
      link.rel = "noopener noreferrer";
      link.title = source?.title || href;

      return link;
    }

    function appendSourceLinks(parent, sources, onValidSource) {
      let count = 0;

      for (const source of Array.isArray(sources) ? sources : []) {
        const link = safeLink(
          source,
          `Source ${count + 1} ↗`
        );

        if (!link) {
          continue;
        }

        if (count === 0) {
          add(parent, "span", "source-label", "Evidence");
        }

        parent.appendChild(link);

        if (onValidSource) {
          onValidSource(source);
        }

        count += 1;
      }

      return count;
    }

    function dateInfo(value) {
      if (!value) {
        return null;
      }

      const date = new Date(value);

      if (Number.isNaN(date.getTime())) {
        return null;
      }

      return {
        date,
        label: new Intl.DateTimeFormat("en-GB", {
          day: "numeric",
          month: "short",
          year: "numeric",
          timeZone: "UTC"
        }).format(date)
      };
    }

    function panel(title, symbol, extra = "") {
      const section = el("section", "panel");
      const head = add(section, "div", "panel-head");
      const heading = add(head, "h2");

      add(heading, "span", "panel-icon", symbol);

      heading.appendChild(
        document.createTextNode(title)
      );

      if (extra) {
        add(head, "span", "panel-tag", extra);
      }

      return section;
    }


    // ============================================
    // Dashboard rendering
    // ============================================

    function render(data, isDemo = false) {
      output.replaceChildren();

      const insights = Array.isArray(data.insight_items)
        ? data.insight_items
        : [];

      const sources = Array.isArray(data.sources)
        ? data.sources
        : [];

      const cited = new Map();


      // ----------------------------------------
      // KPI cards
      // ----------------------------------------

      const cards = add(output, "section", "kpi-grid");

      cards.setAttribute(
        "aria-label",
        "Competitive intelligence overview"
      );

      const kpis = [
        ["Market Position", "—", "Not assessed"],
        [
          "Insights Found",
          insights.length,
          "Source-backed findings",
          "signal"
        ],
        ["Sentiment", "—", "See source coverage below"],
        ["Threat Level", "—", "Not assessed"]
      ];

      for (const [label, value, note, cls] of kpis) {
        const card = add(cards, "article", "kpi");

        add(card, "div", "kpi-label", label);

        add(
          card,
          "div",
          `kpi-value ${cls || ""}`,
          value
        );

        add(card, "div", "kpi-note", note);
      }


      // ----------------------------------------
      // Dashboard layout
      // ----------------------------------------

      const dashboard = add(output, "div", "dashboard");
      const left = add(dashboard, "div", "main-column");
      const right = add(dashboard, "aside", "aside-column");


      // ----------------------------------------
      // Strategic insights
      // ----------------------------------------

      const insightsPanel = panel(
        `${data.company_name || "Company"} — Insights Report`,
        "▤",
        "Source-linked"
      );

      const insightList = add(
        insightsPanel,
        "div",
        "insights"
      );

      insights.forEach((insight, index) => {
        const item = add(
          insightList,
          "article",
          "insight"
        );

        add(
          item,
          "div",
          "insight-icon",
          String(index + 1).padStart(2, "0")
        );

        const body = add(item, "div");

        add(
          body,
          "div",
          "insight-title",
          `STRATEGIC FINDING ${index + 1}`
        );

        add(
          body,
          "div",
          "category-chip",
          CATEGORIES.includes(insight.category)
            ? insight.category
            : "Other"
        );

        add(
          body,
          "p",
          "insight-text",
          insight.text || ""
        );

        appendSourceLinks(
          add(body, "div", "source-row"),
          insight.sources,
          source => cited.set(source.url, source)
        );
      });

      if (!insights.length) {
        add(
          insightList,
          "p",
          "empty-state",
          "No source-backed strategic insights were identified."
        );
      }

      left.appendChild(insightsPanel);


      // ----------------------------------------
      // Executive snapshot
      // ----------------------------------------

      const summaryPanel = panel(
        "Executive Snapshot",
        "▣"
      );

      const summaryBody = add(
        summaryPanel,
        "div",
        "panel-content"
      );

      const summary = data.executive_summary;

      const summarySources = Array.isArray(summary?.sources)
        ? summary.sources
        : [];

      if (
        typeof summary?.text === "string" &&
        summary.text.trim() &&
        summarySources.some(s => safeUrl(s?.url))
      ) {
        add(
          summaryBody,
          "div",
          "snapshot-label",
          "STRATEGIC OVERVIEW"
        );

        add(
          summaryBody,
          "p",
          "snapshot-text",
          summary.text
        );

        appendSourceLinks(
          add(summaryBody, "div", "source-row"),
          summarySources,
          source => cited.set(source.url, source)
        );
      } else {
        add(
          summaryBody,
          "p",
          "snapshot-text",
          "No source-backed executive summary is available."
        );
      }

      left.appendChild(summaryPanel);


      // ----------------------------------------
      // Source sentiment
      // ----------------------------------------

      const sentimentPanel = panel("Sentiment", "◉");

      const sentimentBody = add(
        sentimentPanel,
        "div",
        "sentiment-body"
      );

      const donut = add(
        sentimentBody,
        "div",
        "empty-donut"
      );

      const legend = add(
        sentimentBody,
        "div",
        "sentiment-legend"
      );

      const d = data.sentiment_distribution;

      const fields = [
        "positive",
        "neutral",
        "negative",
        "assessed",
        "unassessed",
        "total_sources"
      ];

      const valid = (
        d &&
        fields.every(
          key => Number.isInteger(d[key]) && d[key] >= 0
        ) &&
        d.assessed > 0 &&
        d.assessed === (
          d.positive + d.neutral + d.negative
        ) &&
        d.total_sources === (
          d.assessed + d.unassessed
        )
      );

      if (valid) {
        const positivePct = (
          100 * d.positive / d.assessed
        );

        const neutralPct = (
          100 * d.neutral / d.assessed
        );

        donut.style.background = `
          conic-gradient(
            #56d7b0 0% ${positivePct}%,
            #f3c46b ${positivePct}% ${positivePct + neutralPct}%,
            #e47b86 ${positivePct + neutralPct}% 100%
          )
        `;

        add(
          donut,
          "span",
          "",
          `${d.assessed}/${d.total_sources}`
        );

        add(
          legend,
          "strong",
          "",
          "Retrieved source coverage"
        );

        const groups = [
          ["Positive", "positive", "#56d7b0"],
          ["Neutral", "neutral", "#f3c46b"],
          ["Negative", "negative", "#e47b86"]
        ];

        for (const [label, key, color] of groups) {
          const row = add(
            legend,
            "div",
            "sentiment-legend-row"
          );

          const name = add(
            row,
            "span",
            "sentiment-legend-label"
          );

          const swatch = add(
            name,
            "span",
            "sentiment-swatch"
          );

          swatch.style.background = color;

          add(name, "span", "", label);

          add(
            row,
            "span",
            "",
            `${d[key]} · ${
              Math.round(100 * d[key] / d.assessed)
            }%`
          );
        }

        add(
          sentimentPanel,
          "p",
          "sentiment-coverage",
          `${d.assessed} of ${d.total_sources} retrieved sources assessed. ` +
          `${d.unassessed} unassessed. ` +
          "Percentages describe assessed sources only."
        );
      } else {
        add(donut, "span", "", "—");
        add(legend, "strong", "", "Not assessed");

        add(
          legend,
          "p",
          "",
          "No usable source-level sentiment distribution is available."
        );
      }

      right.appendChild(sentimentPanel);


      // ----------------------------------------
      // Signal breakdown
      // ----------------------------------------

      const breakdownPanel = panel(
        "Signal Breakdown",
        "▥"
      );

      const breakdownBody = add(
        breakdownPanel,
        "div",
        "breakdown-body"
      );

      if (!insights.length) {
        add(
          breakdownBody,
          "p",
          "breakdown-note",
          "No source-backed insights available to classify."
        );
      } else {
        add(
          breakdownBody,
          "p",
          "breakdown-note",
          "Share of findings in this report, not company-wide activity."
        );

        const counts = Object.fromEntries(
          CATEGORIES.map(category => [category, 0])
        );

        for (const insight of insights) {
          const category = CATEGORIES.includes(
            insight.category
          )
            ? insight.category
            : "Other";

          counts[category] += 1;
        }

        for (const category of CATEGORIES) {
          const count = counts[category];
          const percent = Math.round(
            100 * count / insights.length
          );

          const row = add(
            breakdownBody,
            "div",
            "breakdown-item"
          );

          const heading = add(
            row,
            "div",
            "breakdown-item-head"
          );

          add(heading, "span", "", category);
          add(
            heading,
            "span",
            "",
            `${count} · ${percent}%`
          );

          const track = add(
            row,
            "div",
            "breakdown-track"
          );

          add(
            track,
            "div",
            "breakdown-fill"
          ).style.width = `${percent}%`;
        }
      }

      right.appendChild(breakdownPanel);


      // ----------------------------------------
      // Competitor intelligence
      // ----------------------------------------

      const competitorsPanel = panel(
        "Relevant Competitors",
        "⇄"
      );

      const competitorBody = add(
        competitorsPanel,
        "div",
        "competitor-body"
      );

      let displayed = 0;

      for (
        const record of Array.isArray(data.competitors)
          ? data.competitors
          : []
      ) {
        if (
          typeof record?.name !== "string" ||
          !record.name.trim() ||
          typeof record?.overlap !== "string" ||
          !record.overlap.trim()
        ) {
          continue;
        }

        const hasValidSource = (
          Array.isArray(record.sources) &&
          record.sources.some(
            source => safeUrl(source?.url)
          )
        );

        if (!hasValidSource) {
          continue;
        }

        const entry = add(
          competitorBody,
          "article",
          "competitor-entry"
        );

        add(
          entry,
          "h3",
          "competitor-name",
          record.name
        );

        add(
          entry,
          "p",
          "competitor-overlap",
          record.overlap
        );

        appendSourceLinks(
          add(entry, "div", "source-row"),
          record.sources
        );

        displayed += 1;
      }

      if (!displayed) {
        add(
          competitorBody,
          "p",
          "competitor-overlap",
          "No evidence-backed competitors were identified."
        );
      }

      right.appendChild(competitorsPanel);


      // ----------------------------------------
      // Publication timeline
      // ----------------------------------------

      const timelinePanel = panel("Timeline", "◷");

      add(
        timelinePanel,
        "p",
        "timeline-label",
        "Publication dates of cited sources, not necessarily company event dates."
      );

      const dates = new Map(
        sources
          .filter(
            source => typeof source?.url === "string"
          )
          .map(
            source => [source.url, source.published_at]
          )
      );

      const entries = [...cited.values()]
        .map(source => {
          const info = dateInfo(
            dates.get(source.url)
          );

          return info
            ? { source, ...info }
            : null;
        })
        .filter(Boolean)
        .sort((a, b) => b.date - a.date)
        .slice(0, 6);

      if (entries.length) {
        const timeline = add(
          timelinePanel,
          "ol",
          "timeline"
        );

        for (const item of entries) {
          const li = add(timeline, "li");

          add(
            li,
            "div",
            "timeline-date",
            item.label
          );

          const link = safeLink(
            item.source,
            item.source.title || "Read source",
            "timeline-link"
          );

          if (link) {
            li.appendChild(link);
          }
        }
      } else {
        add(
          timelinePanel,
          "p",
          "empty-state",
          "No publication dates are available for cited sources."
        );
      }

      right.appendChild(timelinePanel);


      // ----------------------------------------
      // Coverage limitation and export state
      // ----------------------------------------

      add(
        output,
        "p",
        "coverage",
        "Insights reflect retrieved evidence, not a comprehensive record. Open citations to verify facts and dates."
      );

      output.style.display = "block";

      demoLabel.style.display = isDemo
        ? "block"
        : "none";

      // Only completed, rendered reports can be exported.
      latestReportData = data;
      latestReportIsDemo = Boolean(isDemo);
      downloadReportButton.disabled = false;
    }


    // ============================================
    // HTML export
    // ============================================

    function escapeHtml(value) {
      return String(value ?? "").replace(
        /[&<>"']/g,
        char => ({
          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          '"': "&quot;",
          "'": "&#39;"
        })[char]
      );
    }

    function sourceHtml(source) {
      const label = escapeHtml(
        source?.title || source?.url || "Source"
      );

      const href = safeUrl(source?.url);

      return href
        ? `<a href="${escapeHtml(href)}"
             target="_blank"
             rel="noopener noreferrer">${label}</a>`
        : label;
    }

    function citationsHtml(sources) {
      if (
        !Array.isArray(sources) ||
        !sources.length
      ) {
        return '<p class="muted">No citations provided.</p>';
      }

      return `
        <ul class="citations">
          ${sources.map(
            source => `<li>${sourceHtml(source)}</li>`
          ).join("")}
        </ul>
      `;
    }

    function listHtml(items, format, emptyText) {
      if (
        !Array.isArray(items) ||
        !items.length
      ) {
        return `<p class="muted">${
          escapeHtml(emptyText)
        }</p>`;
      }

      return `
        <ol>
          ${items.map(format).join("")}
        </ol>
      `;
    }

    function buildReportHtml(data, isDemo = false) {
      const company = escapeHtml(
        data.company_name || "Company"
      );

      const summary = data.executive_summary;
      const stats = data.source_stats || {};
      const d = data.sentiment_distribution;

      const downloadedAt = escapeHtml(
        new Date().toLocaleString()
      );

      return `<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>MarketScope — ${company}</title>

<style>
body {
  font-family: system-ui, Arial, sans-serif;

  padding: 0 24px;

  color: #172033;
  background: white;
}

h1, h2, h3 { line-height: 1.3; }
h1 { font-size: 30px; }

h2 {
  font-size: 21px;

  margin-top: 34px;
}

li { margin-bottom: 16px; }

a {
  color: #1556b0;
  overflow-wrap: anywhere;
}

.muted { color: #64748b; }

.report-text {
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}

.citations {
  padding-left: 22px;
  font-size: 14px;
}

.warning {
  border-left: 3px solid #b45309;
  padding-left: 12px;
}

  padding: 12px;
  border-radius: 8px;
}

@media print {
  body {
    max-width: none;
    margin: 0;
  }
}
</style>
</head>

<body>
<h1>MarketScope — ${company}</h1>

<p class="muted">
  Competitive Intelligence Report<br>
  Downloaded: ${downloadedAt}
</p>

${isDemo
  ? `<p class="demo">
       Preview mode: fictional ExampleCo data,
       not real company research.
     </p>`
  : ""}

<section>
  <h2>Executive Summary</h2>
  <div class="report-text">${
    escapeHtml(summary?.text || "Not available.")
  }</div>
  ${citationsHtml(summary?.sources)}
</section>

<section>
  <h2>Strategic Insights</h2>
  ${listHtml(
    data.insight_items,
    item => `
      <li>
        <h3>${escapeHtml(item?.category || "Other")}</h3>
        <div class="report-text">${
          escapeHtml(item?.text)
        }</div>
        ${citationsHtml(item?.sources)}
      </li>
    `,
    "No strategic insights available."
  )}
</section>

<section>
  <h2>Competitor Analysis</h2>
  ${listHtml(
    data.competitors,
    item => `
      <li>
        <h3>${escapeHtml(item?.name)}</h3>
        <div class="report-text">${
          escapeHtml(item?.overlap)
        }</div>
        ${citationsHtml(item?.sources)}
      </li>
    `,
    "No competitors identified."
  )}
</section>

<section>
  <h2>Source Sentiment</h2>

  ${d
    ? `
      <p>
        Positive: ${escapeHtml(d.positive)} |
        Neutral: ${escapeHtml(d.neutral)} |
        Negative: ${escapeHtml(d.negative)}
      </p>
      <p class="muted">
        Assessed: ${escapeHtml(d.assessed)} |
        Unassessed: ${escapeHtml(d.unassessed)}
      </p>
    `
    : "<p>Not available.</p>"
  }

  ${listHtml(
    data.source_sentiments,
    item => `
      <li>
        ${escapeHtml(item?.label)} —
        ${sourceHtml(item)}
      </li>
    `,
    "No individual sentiment assessments available."
  )}
</section>

<section>
  <h2>Research Coverage</h2>

  <p>
    Research attempts:
    ${escapeHtml(data.research_attempts ?? "Unknown")}
  </p>

  <p>
    Returned: ${escapeHtml(stats.returned ?? "Unknown")} |
    Accepted: ${escapeHtml(stats.accepted ?? "Unknown")} |
    Discarded: ${escapeHtml(stats.discarded ?? "Unknown")}
  </p>

  <h3>Research Warnings</h3>

  ${listHtml(
    data.research_warnings,
    warning => `
      <li class="warning">${escapeHtml(warning)}</li>
    `,
    "No research warnings recorded."
  )}
</section>

<section>
  <h2>Evidence Sources</h2>

  ${listHtml(
    data.sources,
    source => `

            )
          }

      </li>
    `,
    "No sources available."
  )}
</section>

  <h2>Full Report Text</h2>

    escapeHtml(data.report || "Not available.")
  }</div>

<footer>
  <p class="muted">
    MarketScope reports reflect retrieved evidence,
    not necessarily a comprehensive record.
    Verify important claims using the cited sources.
  </p>
</footer>
</body>
</html>`;
    }


    // ============================================
    // Download handler
    // ============================================

    downloadReportButton.addEventListener(
      "click",
      () => {
        if (!latestReportData) {
          return;
        }

        const html = buildReportHtml(
          latestReportData,
          latestReportIsDemo
        );

        const blob = new Blob(
          [html],
          { type: "text/html;charset=utf-8" }
        );

        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");

        const company = String(
          latestReportData.company_name || "company"
        )
          .replace(/[^a-zA-Z0-9_-]/g, "-")
          .slice(0, 60);

        link.href = url;

        link.download =
          `marketscope-${company}${
            latestReportIsDemo ? "-preview" : ""
          }.html`;

        document.body.appendChild(link);
        link.click();
        link.remove();

        setTimeout(() => {
          URL.revokeObjectURL(url);
        }, 1000);
      }
    );


    // ============================================
    // API request
    // ============================================

    async function analyze() {
      const company = input.value.trim();
      const website = websiteInput.value.trim();

      if (!company || button.disabled) {
        return;
      }

      // Prevent an old report being downloaded
      // while a new analysis is running.
      latestReportData = null;
      latestReportIsDemo = false;
      downloadReportButton.disabled = true;

      demoLabel.style.display = "none";
      loader.style.display = "block";
      output.style.display = "none";

      button.disabled = true;
      button.textContent = "Analyzing…";

      try {
        const response = await fetch(
          "/api/v1/analyze",
          {
            method: "POST",
            headers: {
              "Content-Type": "application/json"
            },
            body: JSON.stringify({
              company_name: company,
              official_domain: website || null
            })
          }
        );

        const data = await response.json();

        if (!response.ok) {
          throw new Error(
            typeof data?.detail === "string"
              ? data.detail
              : "Could not complete the analysis."
          );
        }

        if (!data || data.status !== "completed") {
          throw new Error(
            "The analysis did not complete successfully."
          );
        }

        render(data);

      } catch (error) {
        latestReportData = null;
        downloadReportButton.disabled = true;

        output.replaceChildren();

        add(
          output,
          "p",
          "error-box",
          error?.message || "Analysis failed."
        );

        output.style.display = "block";

      } finally {
        loader.style.display = "none";
        button.disabled = false;
        button.textContent = "Analyze";
      }
    }

    form.addEventListener(
      "submit",
      event => {
        event.preventDefault();
        analyze();
      }
    );


    // ============================================
    // Fictional ExampleCo preview
    // ============================================

    if (
      new URLSearchParams(
        location.search
      ).get("preview") === "1"
    ) {
      input.value = "ExampleCo";
      websiteInput.value = "";

      const s1 = {
        title: "Fictional partnership announcement",
        url: "https://example.com/demo-partnership"
      };

      const s2 = {
        title: "Fictional product announcement",
        url: "https://example.com/demo-product"
      };

      const s3 = {
        title: "Fictional integration announcement",
        url: "https://example.com/demo-integration"
      };

      render({
        company_name: "ExampleCo",
        status: "completed",

        report:
          "Fictional ExampleCo announced analytics partnerships and a reporting dashboard. This is preview data, not real research.",

        research_attempts: 0,

        source_stats: {
          returned: 3,
          accepted: 3,
          discarded: 0
        },

        research_warnings: [
          "Preview data only; no live research was performed."
        ],

        executive_summary: {
          text:
            "In this fictional example, ExampleCo announced partnerships and introduced a reporting product. These developments do not establish market leadership or business impact.",
          sources: [s1, s2, s3]
        },

        insight_items: [
          {
            category: "M&A / Partnerships",
            text:
              "Fictional ExampleCo announced an analytics integration partnership with Northstar Labs.",
            sources: [s1]
          },
          {
            category: "Product & Innovation",
            text:
              "Fictional ExampleCo introduced a reporting dashboard.",
            sources: [s2]
          },
          {
            category: "M&A / Partnerships",
            text:
              "Fictional ExampleCo announced a data integration partnership with Harbor Data.",

          { source_id: "S3", label: "neutral", ...s3 }
        ],

        sources: [
          {
            ...s1,

          },

      }, true);
    }
  </script>
</body>
</html>
