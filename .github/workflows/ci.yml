
name: MarketScope CI

on:
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest

    env:
      RUN_LIVE_EVAL: "0"
      MOCK_TAVILY: "true"

      # Placeholder credentials for client initialization.
      # No real API keys are supplied to mocked tests.
      OPENAI_API_KEY: "ci-placeholder"
      TAVILY_API_KEY: "ci-placeholder"
      LANGFUSE_PUBLIC_KEY: "ci-placeholder"
      LANGFUSE_SECRET_KEY: "ci-placeholder"
      LANGFUSE_HOST: "http://127.0.0.1:9"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run mocked pipeline tests
        run: |
          python -m pytest -q -rs
